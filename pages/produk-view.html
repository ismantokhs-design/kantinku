<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Produk - Warungku PWA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Manifest PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#dc2626">
    
    <!-- CSS Tambahan untuk Scrollbar & Mouse Dragging -->
    <style>
        ::-webkit-scrollbar {
            display: none;
        }
        body, html {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #kategoriTabContainer {
            cursor: grab;
            user-select: none;
        }
        #kategoriTabContainer:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col justify-between overflow-y-auto">

    <!-- ================= CEK OTENTIKASI LOKAL ================= -->
    <script>
        const isLoggedIn = localStorage.getItem('kantin_logged_in');
        if (!isLoggedIn) {
            window.location.replace('../login.html');
        } else {
            window.addEventListener('DOMContentLoaded', () => {
                const mainApp = document.getElementById('mainApp');
                if (mainApp) mainApp.classList.remove('hidden');
            });
        }
    </script>

    <!-- ================= TOAST NOTIFIKASI ================= -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span id="toastMsg">Berhasil</span>
    </div>

    <!-- ================= HALAMAN UTAMA PRODUK (READ-ONLY) ================= -->
    <div id="mainApp" class="flex flex-col min-h-screen pb-24 hidden">
        <!-- Header Atas dengan Pencarian & Informasi -->
        <header class="bg-white shadow-xs p-3 sticky top-0 z-40 space-y-2.5 w-full">
            <div class="flex items-center justify-between">
                <h1 class="text-sm font-bold text-gray-900">📦 Daftar Katalog Produk</h1>
            </div>

            <div class="flex items-center bg-gray-100 rounded-xl px-3 py-2 border border-gray-200">
                <span class="text-gray-400 mr-2 text-sm">🔍</span>
                <input type="text" id="searchInput" placeholder="Cari kode atau nama produk..." class="w-full bg-transparent text-xs text-gray-800 focus:outline-none" oninput="filterProduk()">
            </div>

            <!-- Tab Kategori Produk (Bisa Digeser Kanan-Kiri) -->
            <div class="w-full overflow-hidden">
                <div class="flex items-center gap-2 overflow-x-auto pb-2 pt-0.5 scroll-smooth" style="overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none;" id="kategoriTabContainer">
                    <button onclick="pilihKategori('Semua')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition bg-red-600 text-white shadow-sm cursor-pointer flex-shrink-0">
                        🔥 Semua
                    </button>
                    <button onclick="pilihKategori('Makanan')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-gray-100 text-gray-600 hover:bg-gray-200 cursor-pointer flex-shrink-0">
                        🍱 Makanan
                    </button>
                    <button onclick="pilihKategori('Minuman')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-gray-100 text-gray-600 hover:bg-gray-200 cursor-pointer flex-shrink-0">
                        🥤 Minuman
                    </button>
                    <button onclick="pilihKategori('Mie')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-gray-100 text-gray-600 hover:bg-gray-200 cursor-pointer flex-shrink-0">
                        🍜 Mie
                    </button>
                    <button onclick="pilihKategori('Camilan')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-gray-100 text-gray-600 hover:bg-gray-200 cursor-pointer flex-shrink-0">
                        🍿 Camilan
                    </button>
                    <button onclick="pilihKategori('Lainnya')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-gray-100 text-gray-600 hover:bg-gray-200 cursor-pointer flex-shrink-0">
                        📁 Lainnya
                    </button>
                </div>
            </div>

            <div id="jumlahProdukInfo" class="text-[11px] text-gray-500 px-1 font-medium">
                Memuat produk...
            </div>
        </header>

        <!-- Konten Utama: Daftar Produk Vertikal (Read-Only) -->
        <main class="p-3 max-w-md mx-auto w-full space-y-3 flex-1" id="menuListContainer">
            <p class="text-center text-xs text-gray-400 py-8">Memuat data produk...</p>
        </main>

        <!-- ================= PENAMPUNG NAVIGASI BAWAH OTOMATIS ================= -->
        <div id="appNavigation"></div>
    </div>

    <!-- ================= MODAL ZOOM GAMBAR ================= -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4 z-[99] hidden">
        <div class="relative max-w-2xl w-full flex flex-col items-center">
            <button id="closeImageModal" class="absolute -top-10 right-0 text-white hover:text-gray-300 font-bold text-2xl cursor-pointer bg-black/50 w-8 h-8 rounded-full flex items-center justify-center">✕</button>
            <img id="modalZoomImg" src="" alt="Zoom Image" class="max-h-[80vh] max-w-full rounded-2xl shadow-2xl object-contain border border-white/10">
            <p id="modalZoomCaption" class="text-white text-xs mt-3 font-medium text-center bg-black/60 px-4 py-1.5 rounded-full"></p>
        </div>
    </div>

    <!-- ================= SKRIP LOGIKA & FIRESTORE ================= -->
    <script type="module">
        import { db } from "../assets/js/firebase-config.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { initNavigation } from "../assets/js/navigation.js";

        // Inisialisasi Navigasi Terpusat
        document.addEventListener("DOMContentLoaded", () => {
            initNavigation('produk');
            muatDataProduk();
            setupDraggableScroll();
        });

        // Fungsi agar tab kategori bisa digeser pakai mouse (drag)
        function setupDraggableScroll() {
            const slider = document.getElementById('kategoriTabContainer');
            let isDown = false;
            let startX;
            let scrollLeft;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                slider.classList.add('active');
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
            });

            slider.addEventListener('mouseleave', () => { isDown = false; });
            slider.addEventListener('mouseup', () => { isDown = false; });
            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 2;
                slider.scrollLeft = scrollLeft - walk;
            });
        }

        let daftarMenu = [];
        let kategoriAktif = "Semua";

        async function muatDataProduk() {
            try {
                const produkSnap = await getDocs(collection(db, "produk"));
                daftarMenu = [];
                produkSnap.forEach((docSnap) => {
                    daftarMenu.push({ id: docSnap.id, ...docSnap.data() });
                });

                filterProduk();
            } catch (err) {
                console.warn("Gagal memuat dari Firestore: ", err);
                daftarMenu = [];
                filterProduk();
            }
        }

        window.pilihKategori = function(kategori) {
            kategoriAktif = kategori;
            
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.forEach(btn => {
                if (btn.textContent.includes(kategori)) {
                    btn.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition bg-red-600 text-white shadow-sm cursor-pointer flex-shrink-0";
                } else {
                    btn.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-gray-100 text-gray-600 hover:bg-gray-200 cursor-pointer flex-shrink-0";
                }
            });

            filterProduk();
        };

        window.renderMenuList = function(items) {
            const container = document.getElementById('menuListContainer');
            const infoCount = document.getElementById('jumlahProdukInfo');
            infoCount.textContent = `${items.length} produk ditampilkan`;

            if (items.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-gray-400 py-8">Tidak ada produk ditemukan pada kategori ini.</p>`;
                return;
            }

            let html = "";
            items.forEach((item) => {
                let hargaTampil = "Belum ada harga";
                if (item.harga !== undefined && item.harga !== null && item.harga !== "") {
                    hargaTampil = `Rp ${item.harga}`;
                }

                const hargaCoret = (item.hargaCoret !== undefined && item.hargaCoret !== null && item.hargaCoret !== "") ? `Rp ${item.hargaCoret}` : '';
                let stokTampil = (item.stok !== undefined && item.stok !== null && item.stok !== "") ? item.stok : "-";

                html += `
                    <div class="bg-white p-3.5 rounded-2xl shadow-xs border border-gray-100 flex items-center justify-between gap-3">
                        <div class="w-20 h-20 bg-gray-100 rounded-xl overflow-hidden shrink-0 cursor-pointer relative" onclick="openImageZoom('${item.gambar || ''}', '${item.nama || ''}')">
                            <img src="${item.gambar || 'https://via.placeholder.com/150'}" alt="${item.nama || 'Produk'}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 min-w-0 space-y-1">
                            <h4 class="text-xs font-bold text-gray-900 truncate">${item.kode ? item.kode + ' - ' : ''}${item.nama || 'Tanpa Nama'}</h4>
                            <div class="text-xs font-semibold">
                                <span class="text-gray-900">${hargaTampil}</span>
                                ${hargaCoret ? `<span class="text-amber-600 ml-1 font-bold">/ ${hargaCoret}</span>` : ''}
                            </div>
                            <p class="text-[11px] text-red-600 font-bold">Stok Tersedia: ${stokTampil}</p>
                            <span class="inline-block bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded-md font-medium">${item.kategori || 'Umum'}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        };

        window.filterProduk = function() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = daftarMenu.filter(item => {
                const namaProduk = item.nama ? item.nama.toLowerCase() : "";
                const kodeProduk = item.kode ? item.kode.toLowerCase() : "";
                
                const matchKeyword = namaProduk.includes(keyword) || kodeProduk.includes(keyword);
                
                const matchKategori = (kategoriAktif === 'Semua') || 
                                     (item.kategori && item.kategori.toLowerCase() === kategoriAktif.toLowerCase());

                return matchKeyword && matchKategori;
            });

            renderMenuList(filtered);
        };

        // Zoom Gambar Modal
        const imageModal = document.getElementById('imageModal');
        const modalZoomImg = document.getElementById('modalZoomImg');
        const modalZoomCaption = document.getElementById('modalZoomCaption');
        const closeImageModal = document.getElementById('closeImageModal');

        window.openImageZoom = function(imgSrc, captionText) {
            if (!imgSrc) return;
            modalZoomImg.src = imgSrc;
            modalZoomCaption.textContent = captionText || '';
            imageModal.classList.remove('hidden');
        };

        const closeZoomFn = () => imageModal.classList.add('hidden');
        closeImageModal.addEventListener('click', closeZoomFn);
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) closeZoomFn();
        });
    </script>
</body>
</html>
