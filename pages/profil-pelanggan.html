<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pelanggan - Warungku PWA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Manifest PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#dc2626">
    <style>
        /* Menghilangkan scrollbar secara universal */
        html, body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col justify-between pb-24 relative select-none">

    <!-- ================= TOAST NOTIFICATION ================= -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span id="toastMsg">Pesan berhasil</span>
    </div>

    <!-- ================= HEADER ATAS ================= -->
    <header class="bg-white shadow-sm p-3.5 flex justify-between items-center sticky top-0 z-40">
        <a href="../index.html" class="flex items-center gap-2 text-gray-700 hover:text-red-600 transition font-semibold text-sm cursor-pointer">
            <span>←</span> Beranda
        </a>
        <h1 class="text-sm font-bold text-gray-900">Profil Pelanggan</h1>
        <div class="w-12"></div>
    </header>

    <!-- ================= KONTEN UTAMA ================= -->
    <main class="p-4 max-w-md mx-auto w-full space-y-4 flex-1">
        <div class="bg-white p-5 rounded-3xl shadow-xs border border-gray-100 space-y-4">
            <div class="flex items-center gap-3 border-b border-gray-100 pb-4">
                <div class="w-12 h-12 bg-red-50 text-red-600 font-black rounded-2xl flex items-center justify-center text-lg shadow-inner" id="userInitial">
                    U
                </div>
                <div>
                    <h2 id="displayEmail" class="text-xs font-bold text-gray-900">memuat...</h2>
                    <span id="displayRole" class="inline-block mt-1 px-2.5 py-0.5 bg-blue-50 text-blue-700 font-semibold text-[10px] rounded-full">Pelanggan</span>
                </div>
            </div>

            <!-- Form Edit Profil Pelanggan -->
            <form id="profilForm" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="inputNama" placeholder="Masukkan nama lengkap Anda" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Nomor HP / WhatsApp</label>
                    <input type="tel" id="inputNoHp" placeholder="Contoh: 081234567890" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Alamat Lengkap / Patokan</label>
                    <textarea id="inputAlamat" rows="3" placeholder="Masukkan alamat pengiriman atau tempat tinggal..." class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" id="btnSimpan" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-xs shadow-md transition cursor-pointer flex items-center justify-center gap-2">
                        <span>💾</span> Simpan Perubahan Profil
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- ================= PENAMPUNG NAVIGASI BAWAH OTOMATIS ================= -->
    <div id="appNavigation"></div>

    <!-- ================= SCRIPT LOGIKA & FIRESTORE ================= -->
    <script type="module">
        import { db } from "../assets/js/firebase-config.js";
        import { collection, getDocs, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { initNavigation } from "../assets/js/navigation.js";

        document.addEventListener("DOMContentLoaded", () => {
            initNavigation('home');
            muatProfilPelanggan();
        });

        const currentUserEmail = localStorage.getItem('kantin_user_email');
        if (!currentUserEmail) {
            window.location.replace('../login.html');
        }

        const displayEmail = document.getElementById('displayEmail');
        const displayRole = document.getElementById('displayRole');
        const userInitial = document.getElementById('userInitial');
        const inputNama = document.getElementById('inputNama');
        const inputNoHp = document.getElementById('inputNoHp');
        const inputAlamat = document.getElementById('inputAlamat');
        const profilForm = document.getElementById('profilForm');
        const btnSimpan = document.getElementById('btnSimpan');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        let userDocId = null;

        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Ambil data profil dari koleksi 'users' berdasarkan email
        async function muatProfilPelanggan() {
            try {
                displayEmail.textContent = currentUserEmail;
                userInitial.textContent = currentUserEmail.charAt(0).toUpperCase();

                const usersRef = collection(db, "users");
                const q = query(usersRef, where("email", "==", currentUserEmail));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    querySnapshot.forEach((docSnap) => {
                        userDocId = docSnap.id;
                        const data = docSnap.data();
                        
                        displayRole.textContent = data.role || "Pelanggan";
                        inputNama.value = data.nama || "";
                        inputNoHp.value = data.noHp || "";
                        inputAlamat.value = data.alamat || "";
                    });
                }
            } catch (err) {
                console.error("Gagal memuat profil:", err);
                showToast("❌ Gagal memuat data profil!");
            }
        }

        // Simpan pembaruan profil ke database
        profilForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!userDocId) {
                showToast("⚠️ Data akun tidak ditemukan di database!");
                return;
            }

            btnSimpan.textContent = "Menyimpan...";
            btnSimpan.disabled = true;

            try {
                const userRef = doc(db, "users", userDocId);
                await updateDoc(userRef, {
                    nama: inputNama.value.trim(),
                    noHp: inputNoHp.value.trim(),
                    alamat: inputAlamat.value.trim(),
                    updatedAt: new Date().toISOString()
                });

                showToast("✨ Profil berhasil diperbarui!");
            } catch (err) {
                console.error("Gagal menyimpan profil:", err);
                showToast("❌ Terjadi kesalahan saat menyimpan!");
            } finally {
                btnSimpan.textContent = "💾 Simpan Perubahan Profil";
                btnSimpan.disabled = false;
            }
        });
    </script>
</body>
</html>
