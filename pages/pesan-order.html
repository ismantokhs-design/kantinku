<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Pesanan - Warungku PWA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Manifest PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#dc2626">
    
    <!-- CSS Tambahan untuk Scrollbar -->
    <style>
        ::-webkit-scrollbar {
            display: none;
        }
        body, html {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col justify-between overflow-y-auto">

    <!-- ================= CEK OTENTIKASI LOKAL ================= -->
    <script>
        const isLoggedIn = localStorage.getItem('kantin_logged_in');
        if (!isLoggedIn) {
            window.location.replace('../login.html');
        } else {
            window.addEventListener('DOMContentLoaded', () => {
                const mainApp = document.getElementById('mainApp');
                if (mainApp) mainApp.classList.remove('hidden');
            });
        }
    </script>

    <!-- ================= TOAST NOTIFIKASI ================= -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span id="toastMsg">Berhasil</span>
    </div>

    <!-- ================= HALAMAN UTAMA DAFTAR PESANAN ================= -->
    <div id="mainApp" class="flex flex-col min-h-screen pb-32 hidden">
        <!-- Header Atas -->
        <header class="bg-white shadow-xs p-3.5 flex justify-between items-center sticky top-0 z-40">
            <h1 class="text-sm font-bold text-gray-900 flex items-center gap-2">
                <span>📦</span> Daftar Pesanan Masuk
            </h1>
            <button onclick="muatDaftarPesanan()" class="text-xs bg-red-50 text-red-600 font-bold px-3 py-1.5 rounded-xl hover:bg-red-100 transition cursor-pointer">
                Muat Ulang 🔄
            </button>
        </header>

        <!-- Konten Utama: Daftar Pesanan -->
        <main class="p-3 max-w-md mx-auto w-full space-y-3 flex-1" id="orderListContainer">
            <p class="text-center text-xs text-gray-400 py-8">Memuat daftar pesanan...</p>
        </main>

        <!-- ================= PENAMPUNG NAVIGASI BAWAH OTOMATIS ================= -->
        <div id="appNavigation"></div>
    </div>

    <!-- Skrip Interaksi & Firebase Firestore -->
    <script type="module">
        import { db } from "../assets/js/firebase-config.js";
        import { collection, getDocs, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { initNavigation } from "../assets/js/navigation.js";

        // Inisialisasi Navigasi Terpusat (parameter 'order' menandakan menu Order aktif)
        document.addEventListener("DOMContentLoaded", () => {
            initNavigation('order');
            muatDaftarPesanan();
        });

        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        // Ambil Data Pesanan dari Firestore (Koleksi "pesanan")
        async function muatDaftarPesanan() {
            const container = document.getElementById('orderListContainer');
            container.innerHTML = `<p class="text-center text-xs text-gray-400 py-8">Memuat daftar pesanan...</p>`;

            try {
                const q = query(collection(db, "pesanan"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-center text-xs text-gray-400 py-8">Belum ada pesanan masuk.</p>`;
                    return;
                }

                let html = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const orderId = docSnap.id;
                    const tanggal = data.createdAt ? new Date(data.createdAt).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
                    
                    // Warna badge status
                    let statusBg = "bg-amber-50 text-amber-600";
                    if (data.status === "Diproses") statusBg = "bg-blue-50 text-blue-600";
                    if (data.status === "Selesai") statusBg = "bg-emerald-50 text-emerald-600";

                    let listItemsHtml = "";
                    if (data.items && Array.isArray(data.items)) {
                        data.items.forEach(item => {
                            listItemsHtml += `<p class="text-gray-600">• ${item.nama} (${item.qty}x) - Rp ${item.subtotal.toLocaleString('id-ID')}</p>`;
                        });
                    }

                    html += `
                        <div class="bg-white p-4 rounded-2xl shadow-xs border border-gray-100 space-y-2.5">
                            <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                                <div>
                                    <span class="text-xs font-bold text-gray-900">#${orderId.substring(0, 6).toUpperCase()} - ${data.userEmail || 'Pelanggan'}</span>
                                    <p class="text-[10px] text-gray-400">${tanggal}</p>
                                </div>
                                <span class="text-[10px] ${statusBg} font-bold px-2.5 py-1 rounded-full">${data.status || 'Menunggu'}</span>
                            </div>
                            
                            <div class="text-xs space-y-1 bg-gray-50 p-2.5 rounded-xl">
                                ${listItemsHtml}
                                <p class="text-[11px] text-gray-500 italic mt-1">Catatan: ${data.catatan || '-'}</p>
                            </div>

                            <div class="flex justify-between items-center pt-1">
                                <span class="text-xs font-black text-red-600">Total: Rp ${data.total ? data.total.toLocaleString('id-ID') : '0'}</span>
                                <div class="flex gap-1.5">
                                    <button onclick="ubahStatusPesanan('${orderId}', 'Diproses')" class="bg-blue-50 hover:bg-blue-100 text-blue-700 text-[10px] font-bold px-2.5 py-1.5 rounded-lg transition cursor-pointer">
                                        Proses
                                    </button>
                                    <button onclick="ubahStatusPesanan('${orderId}', 'Selesai')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2.5 py-1.5 rounded-lg transition cursor-pointer">
                                        Selesai
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                console.error("Gagal memuat pesanan: ", err);
                container.innerHTML = `<p class="text-center text-xs text-red-500 py-8">Gagal memuat daftar pesanan dari database.</p>`;
            }
        }

        window.ubahStatusPesanan = async function(orderId, statusBaru) {
            try {
                const orderRef = doc(db, "pesanan", orderId);
                await updateDoc(orderRef, { status: statusBaru });
                showToast(`✨ Status pesanan diubah ke "${statusBaru}"`);
                muatDaftarPesanan();
            } catch (err) {
                console.error("Gagal memperbarui status: ", err);
                showToast("❌ Gagal memperbarui status!");
            }
        };

        // Expose function ke window agar bisa dipanggil HTML inline
        window.muatDaftarPesanan = muatDaftarPesanan;
    </script>
</body>
</html>
