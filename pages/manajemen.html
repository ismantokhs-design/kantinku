<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan & Manajemen - Warungku PWA</title>
    <!-- Tailwind CSS CDN Stabil -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Manifest PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#dc2626">
    <style>
        /* Mencegah seleksi teks saat tombol digeser */
        #draggableBtnContainer {
            touch-action: none;
            user-select: none;
        }
        ::-webkit-scrollbar {
            display: none;
        }
        body, html {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col justify-between pb-24 relative overflow-x-hidden">

    <!-- ================= HEADER ATAS ================= -->
    <header class="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-40">
        <a href="../index.html" class="flex items-center gap-2 text-gray-700 hover:text-red-600 transition font-semibold text-sm cursor-pointer">
            <span>←</span> Beranda
        </a>
    </header>

    <!-- ================= KONTEN UTAMA: PENGATURAN & MANAJEMEN ================= -->
    <main class="p-4 max-w-md mx-auto w-full space-y-6 flex-1">
        <!-- Judul Halaman -->
        <div>
            <h1 class="text-xl font-bold text-gray-900">Pengaturan & Manajemen</h1>
            <p class="text-xs text-gray-500 mt-0.5">Kelola data toko, produk, promo, dan informasi lainnya di sini.</p>
        </div>

        <!-- Grid Menu Pilihan (2 Kolom) -->
        <div class="grid grid-cols-2 gap-4">
            <!-- 1. Manajemen Promo -->
            <a href="#" onclick="bukaModul('Manajemen Promo')" class="bg-white p-5 rounded-2xl shadow-xs border border-gray-100 hover:border-red-500 hover:shadow-md transition flex flex-col items-center text-center space-y-3 group cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-red-50 text-red-600 flex items-center justify-center text-xl group-hover:bg-red-600 group-hover:text-white transition">
                    🏷️
                </div>
                <span class="text-xs font-bold text-gray-800">Manajemen Promo</span>
            </a>

            <!-- 2. Running Teks -->
            <a href="#" onclick="bukaModul('Running Teks')" class="bg-white p-5 rounded-2xl shadow-xs border border-gray-100 hover:border-red-500 hover:shadow-md transition flex flex-col items-center text-center space-y-3 group cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-red-50 text-red-600 flex items-center justify-center text-xl group-hover:bg-red-600 group-hover:text-white transition">
                    💬
                </div>
                <span class="text-xs font-bold text-gray-800">Running Teks</span>
            </a>

            <!-- 3. Paketan -->
            <a href="#" onclick="bukaModul('Paketan')" class="bg-white p-5 rounded-2xl shadow-xs border border-gray-100 hover:border-red-500 hover:shadow-md transition flex flex-col items-center text-center space-y-3 group cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-red-50 text-red-600 flex items-center justify-center text-xl group-hover:bg-red-600 group-hover:text-white transition">
                    🎁
                </div>
                <span class="text-xs font-bold text-gray-800">Paketan</span>
            </a>

            <!-- 4. Banner -->
            <a href="#" onclick="bukaModul('Banner')" class="bg-white p-5 rounded-2xl shadow-xs border border-gray-100 hover:border-red-500 hover:shadow-md transition flex flex-col items-center text-center space-y-3 group cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-red-50 text-red-600 flex items-center justify-center text-xl group-hover:bg-red-600 group-hover:text-white transition">
                    🖼️
                </div>
                <span class="text-xs font-bold text-gray-800">Banner</span>
            </a>

            <!-- 5. Kelola Lokasi -->
            <a href="#" onclick="bukaModul('Kelola Lokasi')" class="bg-white p-5 rounded-2xl shadow-xs border border-gray-100 hover:border-red-500 hover:shadow-md transition flex flex-col items-center text-center space-y-3 group cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-red-50 text-red-600 flex items-center justify-center text-xl group-hover:bg-red-600 group-hover:text-white transition">
                    📍
                </div>
                <span class="text-xs font-bold text-gray-800">Kelola Lokasi</span>
            </a>

            <!-- 6. Pelanggan -->
            <a href="#" onclick="bukaModul('Pelanggan')" class="bg-white p-5 rounded-2xl shadow-xs border border-gray-100 hover:border-red-500 hover:shadow-md transition flex flex-col items-center text-center space-y-3 group cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-red-50 text-red-600 flex items-center justify-center text-xl group-hover:bg-red-600 group-hover:text-white transition">
                    👥
                </div>
                <span class="text-xs font-bold text-gray-800">Pelanggan</span>
            </a>
        </div>
    </main>

    <!-- ================= TOMBOL TAMBAH (+) BISA DIGESER (DRAGGABLE) ================= -->
    <div id="draggableBtnContainer" class="fixed z-40 cursor-grab active:cursor-grabbing" style="right: 24px; bottom: 80px;">
        <button id="floatingPlusBtn" class="w-14 h-14 bg-red-600 hover:bg-red-700 text-white rounded-full shadow-lg flex items-center justify-center text-2xl font-bold transition cursor-pointer" title="Tambah Paketan">
            +
        </button>
    </div>

    <!-- ================= PENAMPUNG NAVIGASI BAWAH OTOMATIS ================= -->
    <div id="appNavigation"></div>

    <!-- ================= SCRIPT INTERAKSI & DRAGGABLE ================= -->
    <script type="module">
        import { initNavigation } from "../assets/js/navigation.js";

        // Inisialisasi Navigasi Terpusat (parameter 'lainnya' menandakan menu Lainnya aktif)
        document.addEventListener("DOMContentLoaded", () => {
            initNavigation('lainnya');
        });

        window.bukaModul = function(namaMenu) {
            if (namaMenu === 'Banner') {
                window.location.href = 'banner.html';
            } else if (namaMenu === 'Manajemen Promo') {
                window.location.href = 'promo.html';
            } else if (namaMenu === 'Paketan') {
                window.location.href = 'paketan.html';
            } else if (namaMenu === 'Running Teks') {
                window.location.href = 'running-teks.html';
            } else if (namaMenu === 'Pelanggan') {
                window.location.href = 'pelanggan.html';
            } else {
                alert("Membuka halaman pengaturan untuk: " + namaMenu);
            }
        };

        // --- Logika Tombol Geser (Draggable + Simpan Posisi) ---
        const dragContainer = document.getElementById('draggableBtnContainer');
        const floatingPlusBtn = document.getElementById('floatingPlusBtn');

        let isDragging = false;
        let hasMoved = false;
        let startX, startY, initialX, initialY;

        // Muat posisi tersimpan di localStorage jika ada
        const savedX = localStorage.getItem('fab_pos_x');
        const savedY = localStorage.getItem('fab_pos_y');
        if (savedX !== null && savedY !== null) {
            dragContainer.style.right = 'auto';
            dragContainer.style.bottom = 'auto';
            dragContainer.style.left = savedX + 'px';
            dragContainer.style.top = savedY + 'px';
        }

        function dragStart(e) {
            isDragging = true;
            hasMoved = false;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            startX = clientX;
            startY = clientY;
            
            const rect = dragContainer.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;

            dragContainer.style.right = 'auto';
            dragContainer.style.bottom = 'auto';
        }

        function dragMove(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const dx = clientX - startX;
            const dy = clientY - startY;

            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                hasMoved = true;
            }

            let newX = initialX + dx;
            let newY = initialY + dy;

            // Batasi agar tombol tidak keluar layar
            const maxX = window.innerWidth - dragContainer.offsetWidth;
            const maxY = window.innerHeight - dragContainer.offsetHeight;

            newX = Math.max(0, Math.min(newX, maxX));
            newY = Math.max(0, Math.min(newY, maxY));

            dragContainer.style.left = newX + 'px';
            dragContainer.style.top = newY + 'px';
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;

            if (hasMoved) {
                // Simpan posisi baru ke localStorage
                const rect = dragContainer.getBoundingClientRect();
                localStorage.setItem('fab_pos_x', rect.left);
                localStorage.setItem('fab_pos_y', rect.top);
            }
        }

        // Event Listener Mouse & Touch
        dragContainer.addEventListener('mousedown', dragStart);
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('mouseup', dragEnd);

        dragContainer.addEventListener('touchstart', dragStart, {passive: true});
        window.addEventListener('touchmove', dragMove, {passive: true});
        window.addEventListener('touchend', dragEnd);

        // Fungsi Tombol Tambah (mengarahkan ke paketan.html jika tidak sedang digeser)
        floatingPlusBtn.addEventListener('click', (e) => {
            if (hasMoved) {
                e.preventDefault();
                return;
            }
            window.location.href = 'paketan.html';
        });
    </script>
</body>
</html>
