<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Promo - Warungku PWA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Manifest PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#dc2626">
    <style>
        /* Menghilangkan scrollbar secara universal untuk semua browser */
        html, body {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE dan Edge */
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col justify-between pb-24 relative">

    <!-- ================= TOAST NOTIFICATION (SMOOTH POPUP) ================= -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span id="toastMsg">Pesan berhasil</span>
    </div>

    <!-- ================= HEADER ATAS ================= -->
    <header class="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-40">
        <a href="manajemen.html" class="flex items-center gap-2 text-gray-700 hover:text-red-600 transition font-semibold text-sm">
            <span>←</span> Kembali
        </a>
        <div class="inline-flex items-center border-2 border-red-600 rounded-full px-3 py-1">
            <div class="w-5 h-5 bg-blue-900 rounded-full flex items-center justify-center text-white font-bold text-xs mr-1">W</div>
            <div class="text-left leading-tight">
                <span class="block text-[9px] font-semibold text-black tracking-wider uppercase">APLIKASI</span>
                <span class="block text-sm font-black text-red-600 leading-none">warungku</span>
            </div>
        </div>
    </header>

    <!-- ================= KONTEN UTAMA MANAJEMEN PROMO ================= -->
    <main class="p-4 max-w-md mx-auto w-full space-y-4 flex-1">
        <!-- Judul Halaman -->
        <div class="flex justify-between items-center">
            <h1 class="text-lg font-bold text-gray-900">Manajemen Promo</h1>
        </div>

        <!-- Kolom Pencarian -->
        <div class="relative">
            <input type="text" id="searchInput" placeholder="Cari promo..." 
                class="w-full pl-4 pr-10 py-2.5 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
            <span class="absolute right-3 top-3 text-gray-400">🔍</span>
        </div>

        <!-- Daftar Promo -->
        <div id="promoListContainer" class="space-y-3">
            <p id="emptyMessage" class="text-center text-xs text-gray-400 py-8">Belum ada promo di database.</p>
        </div>
    </main>

    <!-- ================= TOMBOL TAMBAH (+) MENGAMBANG ================= -->
    <div class="fixed bottom-20 right-6 z-40">
        <button onclick="bukaModalTambah()" class="w-14 h-14 bg-red-600 hover:bg-red-700 text-white rounded-full shadow-lg flex items-center justify-center text-2xl font-bold transition cursor-pointer">
            +
        </button>
    </div>

    <!-- ================= MODAL TAMBAH / EDIT PROMO ================= -->
    <div id="modalTambah" class="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden transition-opacity">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-5 space-y-4 relative max-h-[90vh] overflow-y-auto">
            <button onclick="tutupModalTambah()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-sm cursor-pointer">✕</button>
            <h3 id="modalTitle" class="text-base font-bold text-gray-900 border-b pb-2">Tambah Promo Baru</h3>

            <form id="promoForm" class="space-y-3">
                <input type="hidden" id="promoId">
                
                <!-- Pratinjau Gambar (4:5) -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Pratinjau Gambar (4:5)</label>
                    <div id="previewBox" class="w-32 h-40 mx-auto bg-gray-100 rounded-xl overflow-hidden border border-dashed border-gray-300 flex items-center justify-center">
                        <img id="imagePreview" src="" alt="Pratinjau" class="w-full h-full object-cover hidden">
                        <span id="previewPlaceholder" class="text-[10px] text-gray-400 text-center p-2">Pratinjau Gambar (4:5)</span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Promo</label>
                    <input type="text" id="promoNama" required placeholder="Misal: Minyak Goreng" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Keterangan</label>
                    <input type="text" id="promoKeterangan" required placeholder="Misal: Diskon 20%" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Upload Gambar</label>
                    <input type="file" id="promoFile" accept="image/*" 
                        class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 cursor-pointer">
                    <p class="text-[10px] text-gray-400 mt-1">*Kosongkan jika tidak ingin mengubah gambar saat Edit.</p>
                </div>

                <button type="submit" id="btnSimpanPromo" class="w-full bg-blue-900 hover:bg-blue-950 text-white py-2.5 rounded-xl font-bold shadow transition cursor-pointer text-xs">
                    Simpan Promo
                </button>
            </form>
        </div>
    </div>

    <!-- ================= NAVIGASI BAWAH ================= -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-4 flex justify-around items-center z-50 max-w-md mx-auto">
        <a href="../index.html" class="flex flex-col items-center text-gray-400 text-xs font-medium">
            <span class="text-lg">🏠</span>
            <span>Beranda</span>
        </a>
        <a href="#" class="flex flex-col items-center text-red-600 text-xs font-semibold">
            <span class="text-lg">🏷️</span>
            <span>Promo</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 text-xs font-medium">
            <span class="text-lg">📢</span>
            <span>Broadcast</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 text-xs font-medium">
            <span class="text-lg">📅</span>
            <span>Event</span>
        </a>
        <button id="btnLainnya" class="flex flex-col items-center text-gray-400 text-xs font-medium bg-transparent border-none cursor-pointer focus:outline-none">
            <span class="text-lg">☰</span>
            <span>Lainnya</span>
        </button>
    </nav>

    <!-- ================= OPTION MENU (POP-UP) ================= -->
    <div id="optionMenuModal" class="fixed inset-0 bg-black/30 flex items-end justify-end pb-16 pr-4 z-50 hidden">
        <div class="bg-white text-gray-800 w-52 rounded-2xl shadow-xl overflow-hidden border border-gray-200">
            <div class="bg-red-600 text-white px-4 py-2.5 flex justify-between items-center">
                <span class="font-bold tracking-wider text-xs uppercase">OPTION MENU</span>
                <button id="btnCloseOption" class="text-white hover:text-gray-200 font-bold text-sm cursor-pointer">✕</button>
            </div>
            <div class="py-1 divide-y divide-gray-100 text-xs font-medium">
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition text-gray-700">
                    <span class="text-red-600 text-base">⚙️</span>
                    <span>Pengaturan</span>
                </a>
                <a href="manajemen.html" class="flex items-center gap-3 px-4 py-3 bg-red-50 text-red-600 font-bold transition">
                    <span class="text-base">🏷️</span>
                    <span>Manajemen</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition text-gray-700">
                    <span class="text-red-600 text-base">📅</span>
                    <span>Event</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition text-gray-700">
                    <span class="text-red-600 text-base">📦</span>
                    <span>Lihat Pesanan</span>
                </a>
            </div>
        </div>
    </div>

    <!-- ================= SCRIPT LOGIKA & FIRESTORE ================= -->
    <script type="module">
        import { db } from "../assets/js/firebase-config.js";
        import { collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const modalTambah = document.getElementById('modalTambah');
        const modalTitle = document.getElementById('modalTitle');
        const promoForm = document.getElementById('promoForm');
        const promoIdInput = document.getElementById('promoId');
        const promoNama = document.getElementById('promoNama');
        const promoKeterangan = document.getElementById('promoKeterangan');
        const promoFile = document.getElementById('promoFile');
        const imagePreview = document.getElementById('imagePreview');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const btnSimpanPromo = document.getElementById('btnSimpanPromo');
        const promoListContainer = document.getElementById('promoListContainer');
        const searchInput = document.getElementById('searchInput');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        let base64String = "";
        let existingImageUrl = "";
        let allPromos = [];

        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        window.bukaModalTambah = function() {
            modalTitle.textContent = "Tambah Promo Baru";
            promoIdInput.value = "";
            promoForm.reset();
            imagePreview.src = "";
            imagePreview.classList.add('hidden');
            previewPlaceholder.classList.remove('hidden');
            base64String = "";
            existingImageUrl = "";
            modalTambah.classList.remove('hidden');
        }

        window.tutupModalTambah = function() {
            modalTambah.classList.add('hidden');
            promoForm.reset();
            imagePreview.src = "";
            imagePreview.classList.add('hidden');
            previewPlaceholder.classList.remove('hidden');
            base64String = "";
            existingImageUrl = "";
        }

        window.bukaModalEdit = function(id, nama, keterangan, gambar) {
            modalTitle.textContent = "Edit Promo";
            promoIdInput.value = id;
            promoNama.value = nama;
            promoKeterangan.value = keterangan;
            existingImageUrl = gambar;
            base64String = gambar;

            imagePreview.src = gambar;
            imagePreview.classList.remove('hidden');
            previewPlaceholder.classList.add('hidden');
            modalTambah.classList.remove('hidden');
        }

        promoFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    base64String = uploadEvent.target.result;
                    imagePreview.src = base64String;
                    imagePreview.classList.remove('hidden');
                    previewPlaceholder.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        promoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nama = promoNama.value.trim();
            const keterangan = promoKeterangan.value.trim();
            const id = promoIdInput.value;

            if (!base64String) {
                showToast("⚠️ Pilih gambar terlebih dahulu!");
                return;
            }

            btnSimpanPromo.textContent = "Menyimpan...";
            btnSimpanPromo.disabled = true;

            try {
                if (id) {
                    const promoRef = doc(db, "promo", id);
                    await updateDoc(promoRef, {
                        nama: nama,
                        keterangan: keterangan,
                        gambar: base64String
                    });
                    showToast("✨ Promo berhasil diperbarui!");
                } else {
                    await addDoc(collection(db, "promo"), {
                        nama: nama,
                        keterangan: keterangan,
                        gambar: base64String,
                        status: true,
                        createdAt: new Date().toISOString()
                    });
                    showToast("✨ Promo berhasil disimpan!");
                }

                tutupModalTambah();
                muatDataPromo();
            } catch (error) {
                console.error("Gagal simpan promo: ", error);
                showToast("❌ Terjadi kesalahan!");
            } finally {
                btnSimpanPromo.textContent = "Simpan Promo";
                btnSimpanPromo.disabled = false;
            }
        });

        window.hapusPromo = async function(id) {
            if (confirm("Apakah Anda yakin ingin menghapus promo ini?")) {
                try {
                    await deleteDoc(doc(db, "promo", id));
                    showToast("🗑️ Promo berhasil dihapus!");
                    muatDataPromo();
                } catch (err) {
                    console.error("Gagal hapus: ", err);
                    showToast("❌ Gagal menghapus promo!");
                }
            }
        }

        window.ubahStatusPromo = async function(id, currentStatus) {
            try {
                const promoRef = doc(db, "promo", id);
                await updateDoc(promoRef, {
                    status: !currentStatus
                });
                showToast("🔄 Status promo diubah!");
                muatDataPromo();
            } catch (err) {
                console.error("Gagal ubah status: ", err);
            }
        }

        async function muatDataPromo() {
            try {
                const q = query(collection(db, "promo"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                allPromos = [];
                querySnapshot.forEach((docSnap) => {
                    allPromos.push({ id: docSnap.id, ...docSnap.data() });
                });

                tampilkanPromo(allPromos);
            } catch (err) {
                console.error("Gagal memuat promo: ", err);
            }
        }

        function tampilkanPromo(dataArray) {
            if (dataArray.length === 0) {
                promoListContainer.innerHTML = `<p class="text-center text-xs text-gray-400 py-8">Belum ada promo di database.</p>`;
                return;
            }

            promoListContainer.innerHTML = "";
            dataArray.forEach((data) => {
                const isActive = data.status !== false;

                const card = `
                    <div class="bg-white p-4 rounded-2xl shadow-xs border border-gray-100 space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-16 h-20 bg-gray-200 rounded-lg overflow-hidden flex-shrink-0">
                                    <img src="${data.gambar}" alt="${data.nama}" class="w-full h-full object-cover">
                                </div>
                                <div>
                                    <h2 class="text-xs font-bold text-gray-900">${data.nama}</h2>
                                    <p class="text-[11px] text-gray-500">${data.keterangan || '-'}</p>
                                    <span class="text-[10px] ${isActive ? 'text-green-600 font-semibold' : 'text-gray-400'}">${isActive ? 'Status: Aktif' : 'Status: Non-aktif'}</span>
                                </div>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" ${isActive ? 'checked' : ''} onchange="ubahStatusPromo('${data.id}', ${isActive})" class="sr-only peer">
                                <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-900"></div>
                            </label>
                        </div>
                        
                        <div class="flex justify-end gap-2 pt-2 border-t border-gray-100">
                            <button onclick="bukaModalEdit('${data.id}', '${data.nama.replace(/'/g, "\\'")}', '${(data.keterangan || '').replace(/'/g, "\\'")}', '${data.gambar}')" class="px-3 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 text-[11px] font-bold rounded-lg transition cursor-pointer flex items-center gap-1">
                                ✏️ Edit
                            </button>
                            <button onclick="hapusPromo('${data.id}')" class="px-3 py-1 bg-red-50 hover:bg-red-100 text-red-600 text-[11px] font-bold rounded-lg transition cursor-pointer flex items-center gap-1">
                                🗑️ Hapus
                            </button>
                        </div>
                    </div>
                `;
                promoListContainer.innerHTML += card;
            });
        }

        // Fitur Pencarian Real-time
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allPromos.filter(item => 
                item.nama.toLowerCase().includes(keyword) || 
                (item.keterangan && item.keterangan.toLowerCase().includes(keyword))
            );
            tampilkanPromo(filtered);
        });

        document.addEventListener("DOMContentLoaded", muatDataPromo);

        // Skrip Option Menu Bawah
        const btnLainnya = document.getElementById('btnLainnya');
        const optionMenuModal = document.getElementById('optionMenuModal');
        const btnCloseOption = document.getElementById('btnCloseOption');

        btnLainnya.addEventListener('click', (e) => {
            e.stopPropagation();
            optionMenuModal.classList.remove('hidden');
        });

        btnCloseOption.addEventListener('click', () => {
            optionMenuModal.classList.add('hidden');
        });

        window.addEventListener('click', (e) => {
            if (e.target === optionMenuModal) {
                optionMenuModal.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
