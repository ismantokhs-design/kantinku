<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Banner - Warungku PWA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Manifest PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#dc2626">
    <style>
        /* Menghilangkan scrollbar secara universal untuk semua browser */
        html, body {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE dan Edge */
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col justify-between pb-24 relative">

    <!-- ================= TOAST NOTIFICATION (SMOOTH POPUP) ================= -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span id="toastMsg">Pesan berhasil</span>
    </div>

    <!-- ================= HEADER ATAS ================= -->
    <header class="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-40">
        <a href="manajemen.html" class="flex items-center gap-2 text-gray-700 hover:text-red-600 transition font-semibold text-sm">
            <span>←</span> Kembali
        </a>
        <div class="inline-flex items-center border-2 border-red-600 rounded-full px-3 py-1">
            <div class="w-5 h-5 bg-blue-900 rounded-full flex items-center justify-center text-white font-bold text-xs mr-1">W</div>
            <div class="text-left leading-tight">
                <span class="block text-[9px] font-semibold text-black tracking-wider uppercase">APLIKASI</span>
                <span class="block text-sm font-black text-red-600 leading-none">warungku</span>
            </div>
        </div>
    </header>

    <!-- ================= KONTEN UTAMA MANAJEMEN BANNER ================= -->
    <main class="p-4 max-w-md mx-auto w-full space-y-4 flex-1">
        <!-- Judul Halaman (Tombol Tambah Atas Telah Dihilangkan) -->
        <div class="flex justify-between items-center">
            <h1 class="text-lg font-bold text-gray-900">Manajemen Banner</h1>
        </div>

        <!-- Kolom Pencarian -->
        <div class="relative">
            <input type="text" id="searchInput" placeholder="Cari banner..." 
                class="w-full pl-4 pr-10 py-2.5 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
            <span class="absolute right-3 top-3 text-gray-400">🔍</span>
        </div>

        <!-- Daftar Banner -->
        <div id="bannerListContainer" class="space-y-3">
            <p id="emptyMessage" class="text-center text-xs text-gray-400 py-8">Belum ada banner di database.</p>
        </div>
    </main>

    <!-- ================= TOMBOL TAMBAH (+) MENGAMBANG ================= -->
    <div class="fixed bottom-20 right-6 z-40">
        <button onclick="bukaModalTambah()" class="w-14 h-14 bg-red-600 hover:bg-red-700 text-white rounded-full shadow-lg flex items-center justify-center text-2xl font-bold transition cursor-pointer">
            +
        </button>
    </div>

    <!-- ================= MODAL TAMBAH / EDIT BANNER ================= -->
    <div id="modalTambah" class="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden transition-opacity">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-5 space-y-4 relative">
            <button onclick="tutupModalTambah()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-sm cursor-pointer">✕</button>
            <h3 id="modalTitle" class="text-base font-bold text-gray-900 border-b pb-2">Tambah Banner Baru</h3>

            <form id="bannerForm" class="space-y-3">
                <input type="hidden" id="bannerId">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Nama / Judul Banner</label>
                    <input type="text" id="bannerNama" required placeholder="Misal: Promo Akhir Tahun" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Pilih File Gambar Banner</label>
                    <input type="file" id="bannerFile" accept="image/*" 
                        class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 cursor-pointer">
                    <p class="text-[10px] text-gray-400 mt-1">*Kosongkan jika tidak ingin mengubah gambar saat Edit.</p>
                </div>

                <!-- Pratinjau Gambar -->
                <div id="previewBox" class="hidden h-32 bg-gray-100 rounded-xl overflow-hidden border border-dashed border-gray-300 flex items-center justify-center">
                    <img id="imagePreview" src="" alt="Pratinjau" class="w-full h-full object-cover">
                </div>

                <button type="submit" id="btnSimpanBanner" class="w-full bg-blue-900 hover:bg-blue-950 text-white py-2.5 rounded-xl font-bold shadow transition cursor-pointer text-xs">
                    Simpan Banner
                </button>
            </form>
        </div>
    </div>

    <!-- ================= NAVIGASI BAWAH ================= -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-4 flex justify-around items-center z-50 max-w-md mx-auto">
        <a href="../index.html" class="flex flex-col items-center text-gray-400 text-xs font-medium">
            <span class="text-lg">🏠</span>
            <span>Beranda</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 text-xs font-medium">
            <span class="text-lg">🏷️</span>
            <span>Promo</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 text-xs font-medium">
            <span class="text-lg">📢</span>
            <span>Broadcast</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 text-xs font-medium">
            <span class="text-lg">📅</span>
            <span>Event</span>
        </a>
        <button id="btnLainnya" class="flex flex-col items-center text-red-600 text-xs font-semibold bg-transparent border-none cursor-pointer focus:outline-none">
            <span class="text-lg">☰</span>
            <span>Lainnya</span>
        </button>
    </nav>

    <!-- ================= OPTION MENU (POP-UP) ================= -->
    <div id="optionMenuModal" class="fixed inset-0 bg-black/30 flex items-end justify-end pb-16 pr-4 z-50 hidden">
        <div class="bg-white text-gray-800 w-52 rounded-2xl shadow-xl overflow-hidden border border-gray-200">
            <div class="bg-red-600 text-white px-4 py-2.5 flex justify-between items-center">
                <span class="font-bold tracking-wider text-xs uppercase">OPTION MENU</span>
                <button id="btnCloseOption" class="text-white hover:text-gray-200 font-bold text-sm cursor-pointer">✕</button>
            </div>
            <div class="py-1 divide-y divide-gray-100 text-xs font-medium">
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition text-gray-700">
                    <span class="text-red-600 text-base">⚙️</span>
                    <span>Pengaturan</span>
                </a>
                <a href="manajemen.html" class="flex items-center gap-3 px-4 py-3 bg-red-50 text-red-600 font-bold transition">
                    <span class="text-base">🏷️</span>
                    <span>Manajemen</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition text-gray-700">
                    <span class="text-red-600 text-base">📅</span>
                    <span>Event</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition text-gray-700">
                    <span class="text-red-600 text-base">📦</span>
                    <span>Lihat Pesanan</span>
                </a>
            </div>
        </div>
    </div>

    <!-- ================= SCRIPT LOGIKA & FIRESTORE ================= -->
    <script type="module">
        import { db } from "../assets/js/firebase-config.js";
        import { collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const modalTambah = document.getElementById('modalTambah');
        const modalTitle = document.getElementById('modalTitle');
        const bannerForm = document.getElementById('bannerForm');
        const bannerIdInput = document.getElementById('bannerId');
        const bannerNama = document.getElementById('bannerNama');
        const bannerFile = document.getElementById('bannerFile');
        const previewBox = document.getElementById('previewBox');
        const imagePreview = document.getElementById('imagePreview');
        const btnSimpanBanner = document.getElementById('btnSimpanBanner');
        const bannerListContainer = document.getElementById('bannerListContainer');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        let base64String = "";
        let existingImageUrl = "";

        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        window.bukaModalTambah = function() {
            modalTitle.textContent = "Tambah Banner Baru";
            bannerIdInput.value = "";
            bannerForm.reset();
            previewBox.classList.add('hidden');
            base64String = "";
            existingImageUrl = "";
            modalTambah.classList.remove('hidden');
        }

        window.tutupModalTambah = function() {
            modalTambah.classList.add('hidden');
            bannerForm.reset();
            previewBox.classList.add('hidden');
            base64String = "";
            existingImageUrl = "";
        }

        window.bukaModalEdit = function(id, nama, gambar, status) {
            modalTitle.textContent = "Edit Banner";
            bannerIdInput.value = id;
            bannerNama.value = nama;
            existingImageUrl = gambar;
            base64String = gambar;

            imagePreview.src = gambar;
            previewBox.classList.remove('hidden');
            modalTambah.classList.remove('hidden');
        }

        bannerFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    base64String = uploadEvent.target.result;
                    imagePreview.src = base64String;
                    previewBox.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        bannerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nama = bannerNama.value.trim();
            const id = bannerIdInput.value;

            if (!base64String) {
                showToast("⚠️ Pilih gambar terlebih dahulu!");
                return;
            }

            btnSimpanBanner.textContent = "Menyimpan...";
            btnSimpanBanner.disabled = true;

            try {
                if (id) {
                    const bannerRef = doc(db, "banner", id);
                    await updateDoc(bannerRef, {
                        nama: nama,
                        gambar: base64String
                    });
                    showToast("✨ Banner berhasil diperbarui!");
                } else {
                    await addDoc(collection(db, "banner"), {
                        nama: nama,
                        gambar: base64String,
                        status: true,
                        createdAt: new Date().toISOString()
                    });
                    showToast("✨ Banner berhasil disimpan!");
                }

                tutupModalTambah();
                muatDataBanner();
            } catch (error) {
                console.error("Gagal simpan banner: ", error);
                showToast("❌ Terjadi kesalahan!");
            } finally {
                btnSimpanBanner.textContent = "Simpan Banner";
                btnSimpanBanner.disabled = false;
            }
        });

        window.hapusBanner = async function(id) {
            if (confirm("Apakah Anda yakin ingin menghapus banner ini?")) {
                try {
                    await deleteDoc(doc(db, "banner", id));
                    showToast("🗑️ Banner berhasil dihapus!");
                    muatDataBanner();
                } catch (err) {
                    console.error("Gagal hapus: ", err);
                    showToast("❌ Gagal menghapus banner!");
                }
            }
        }

        window.ubahStatusBanner = async function(id, currentStatus) {
            try {
                const bannerRef = doc(db, "banner", id);
                await updateDoc(bannerRef, {
                    status: !currentStatus
                });
                showToast("🔄 Status banner diubah!");
                muatDataBanner();
            } catch (err) {
                console.error("Gagal ubah status: ", err);
            }
        }

        async function muatDataBanner() {
            try {
                const q = query(collection(db, "banner"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    bannerListContainer.innerHTML = `<p class="text-center text-xs text-gray-400 py-8">Belum ada banner di database.</p>`;
                    return;
                }

                bannerListContainer.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const isActive = data.status !== false;

                    const card = `
                        <div class="bg-white p-4 rounded-2xl shadow-xs border border-gray-100 space-y-3">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="w-20 h-12 bg-gray-200 rounded-lg overflow-hidden flex-shrink-0">
                                        <img src="${data.gambar}" alt="${data.nama}" class="w-full h-full object-cover">
                                    </div>
                                    <div>
                                        <h2 class="text-xs font-bold text-gray-900">${data.nama}</h2>
                                        <span class="text-[10px] ${isActive ? 'text-green-600 font-semibold' : 'text-gray-400'}">${isActive ? 'Aktif' : 'Non-aktif'}</span>
                                    </div>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" ${isActive ? 'checked' : ''} onchange="ubahStatusBanner('${docId}', ${isActive})" class="sr-only peer">
                                    <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-900"></div>
                                </label>
                            </div>
                            
                            <div class="flex justify-end gap-2 pt-2 border-t border-gray-100">
                                <button onclick="bukaModalEdit('${docId}', '${data.nama.replace(/'/g, "\\'")}', '${data.gambar}', ${isActive})" class="px-3 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 text-[11px] font-bold rounded-lg transition cursor-pointer flex items-center gap-1">
                                    ✏️ Edit
                                </button>
                                <button onclick="hapusBanner('${docId}')" class="px-3 py-1 bg-red-50 hover:bg-red-100 text-red-600 text-[11px] font-bold rounded-lg transition cursor-pointer flex items-center gap-1">
                                    🗑️ Hapus
                                </button>
                            </div>
                        </div>
                    `;
                    bannerListContainer.innerHTML += card;
                });
            } catch (err) {
                console.error("Gagal memuat banner: ", err);
            }
        }

        document.addEventListener("DOMContentLoaded", muatDataBanner);

        const btnLainnya = document.getElementById('btnLainnya');
        const optionMenuModal = document.getElementById('optionMenuModal');
        const btnCloseOption = document.getElementById('btnCloseOption');

        btnLainnya.addEventListener('click', (e) => {
            e.stopPropagation();
            optionMenuModal.classList.remove('hidden');
        });

        btnCloseOption.addEventListener('click', () => {
            optionMenuModal.classList.add('hidden');
        });

        window.addEventListener('click', (e) => {
            if (e.target === optionMenuModal) {
                optionMenuModal.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
