<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Pelanggan - Warungku PWA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Manifest PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#dc2626">
    <style>
        /* Menghilangkan scrollbar secara universal */
        html, body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col justify-between pb-24 relative select-none">

    <!-- ================= TOAST NOTIFICATION ================= -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span id="toastMsg">Pesan berhasil</span>
    </div>

    <!-- ================= HEADER ATAS ================= -->
    <header class="bg-white shadow-sm p-3.5 flex justify-between items-center sticky top-0 z-40">
        <a href="manajemen.html" class="flex items-center gap-2 text-gray-700 hover:text-red-600 transition font-semibold text-sm cursor-pointer">
            <span>←</span> Kembali
        </a>
        <h1 class="text-sm font-bold text-gray-900">Daftar Pelanggan / User</h1>
        <div class="w-12"></div>
    </header>

    <!-- ================= KONTEN UTAMA ================= -->
    <main class="p-4 max-w-md mx-auto w-full space-y-4 flex-1">
        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h3 class="font-bold text-sm text-gray-900">👥 Akun Terdaftar di Database</h3>
            </div>
            
            <!-- Container Daftar Pelanggan -->
            <div id="pelangganListContainer" class="space-y-3">
                <p class="text-center text-xs text-gray-400 py-8">Memuat data pelanggan...</p>
            </div>
        </div>
    </main>

    <!-- ================= MODAL EDIT PELANGGAN ================= -->
    <div id="editModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden transition-opacity duration-300">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl transform transition-all duration-300 scale-95 opacity-0" id="editModalContent">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="font-bold text-sm text-gray-900">✏️ Edit Akun Pelanggan</h3>
                <button onclick="tutupModalEdit()" class="text-gray-400 hover:text-gray-600 font-bold text-sm cursor-pointer">✕</button>
            </div>
            <input type="hidden" id="editUserId">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Email / Nama Akun</label>
                    <input type="text" id="editEmailInput" placeholder="Masukkan email atau nama" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>
                <div class="pt-2 flex gap-2">
                    <button onclick="tutupModalEdit()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 py-2.5 rounded-xl font-bold text-xs transition cursor-pointer">Batal</button>
                    <button onclick="simpanEditPelanggan()" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl font-bold text-xs transition cursor-pointer shadow">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= MODAL KONFIRMASI HAPUS KUSTOM ================= -->
    <div id="deleteModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden transition-opacity duration-300">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl transform transition-all duration-300 scale-95 opacity-0 text-center" id="deleteModalContent">
            <div class="w-12 h-12 bg-red-50 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl shadow-inner">
                ⚠️
            </div>
            <div>
                <h3 class="font-bold text-sm text-gray-900 mb-1">Konfirmasi Hapus</h3>
                <p class="text-xs text-gray-500">Apakah Anda yakin ingin menghapus akun pelanggan ini dari database?</p>
            </div>
            <input type="hidden" id="deleteUserId">
            <div class="pt-2 flex gap-2">
                <button onclick="tutupModalHapus()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 py-2.5 rounded-xl font-bold text-xs transition cursor-pointer">Batal</button>
                <button onclick="eksekusiHapusPelanggan()" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl font-bold text-xs transition cursor-pointer shadow">Hapus</button>
            </div>
        </div>
    </div>

    <!-- ================= PENAMPUNG NAVIGASI BAWAH OTOMATIS ================= -->
    <div id="appNavigation"></div>

    <!-- ================= SCRIPT LOGIKA & FIRESTORE ================= -->
    <script type="module">
        import { db } from "../assets/js/firebase-config.js";
        import { collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { initNavigation } from "../assets/js/navigation.js";

        document.addEventListener("DOMContentLoaded", () => {
            initNavigation('lainnya');
            muatDataPelanggan();
        });

        const pelangganListContainer = document.getElementById('pelangganListContainer');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        // Muat Data Pelanggan / User dari Koleksi 'users'
        async function muatDataPelanggan() {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));

                if (querySnapshot.empty) {
                    pelangganListContainer.innerHTML = `<p class="text-center text-xs text-gray-400 py-8">Belum ada pelanggan yang terdaftar.</p>`;
                    return;
                }

                let usersArray = [];
                querySnapshot.forEach((docSnap) => {
                    usersArray.push({ id: docSnap.id, ...docSnap.data() });
                });

                // Urutkan data berdasarkan waktuDibuat terbaru secara aman di sisi klien
                usersArray.sort((a, b) => {
                    const timeA = a.waktuDibuat ? new Date(a.waktuDibuat).getTime() : 0;
                    const timeB = b.waktuDibuat ? new Date(b.waktuDibuat).getTime() : 0;
                    return timeB - timeA;
                });

                pelangganListContainer.innerHTML = "";
                let nomor = 1;

                usersArray.forEach((data) => {
                    const docId = data.id;
                    const email = data.email || "Email tidak tersedia";
                    const currentRole = data.role || "Pelanggan";
                    
                    let tanggalFormat = "-";
                    if (data.waktuDibuat) {
                        const dateObj = new Date(data.waktuDibuat);
                        tanggalFormat = dateObj.toLocaleDateString('id-ID', {
                            day: 'numeric',
                            month: 'short',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    }

                    const card = `
                        <div class="bg-white p-4 rounded-2xl shadow-xs border border-gray-100 flex items-center justify-between gap-3">
                            <div class="w-10 h-10 bg-red-50 text-red-600 font-bold rounded-xl flex items-center justify-center text-xs shrink-0 shadow-inner">
                                #${nomor++}
                            </div>
                            <div class="flex-1 min-w-0 space-y-1">
                                <h4 class="text-xs font-bold text-gray-900 truncate" title="${email}">${email}</h4>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <select onchange="ubahRole('${docId}', this.value)" class="px-2 py-1 bg-gray-50 border border-gray-200 text-gray-800 font-semibold text-[11px] rounded-xl focus:outline-none focus:ring-1 focus:ring-red-600 cursor-pointer">
                                        <option value="Admin" ${currentRole === 'Admin' ? 'selected' : ''}>Admin</option>
                                        <option value="Pelanggan" ${currentRole === 'Pelanggan' || currentRole === 'Member Setia' ? 'selected' : ''}>Pelanggan</option>
                                    </select>
                                    <span class="text-[10px] text-gray-400">📅 ${tanggalFormat}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <button onclick="bukaModalEdit('${docId}', '${email.replace(/'/g, "\\'")}')" class="p-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition cursor-pointer text-xs" title="Edit Akun">
                                    ✏️
                                </button>
                                <button onclick="bukaModalHapus('${docId}')" class="p-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl transition cursor-pointer text-xs" title="Hapus Akun">
                                    🗑️
                                </button>
                            </div>
                        </div>
                    `;
                    pelangganListContainer.innerHTML += card;
                });
            } catch (err) {
                console.error("Gagal memuat data pelanggan:", err);
                pelangganListContainer.innerHTML = `<p class="text-center text-xs text-red-500 py-6">Gagal memuat data pelanggan.</p>`;
            }
        }

        // Fungsi Mengubah Role User di Firestore
        window.ubahRole = async function(id, roleBaru) {
            try {
                const userRef = doc(db, "users", id);
                await updateDoc(userRef, { role: roleBaru });
                showToast(`✨ Role berhasil diubah menjadi "${roleBaru}"!`);
            } catch (err) {
                console.error("Gagal mengubah role:", err);
                showToast("❌ Gagal mengubah role user!");
            }
        }

        // Buka Modal Edit dengan Animasi Smooth
        window.bukaModalEdit = function(id, currentEmail) {
            document.getElementById('editUserId').value = id;
            document.getElementById('editEmailInput').value = currentEmail;
            const modal = document.getElementById('editModal');
            const content = document.getElementById('editModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        // Tutup Modal Edit dengan Animasi Smooth
        window.tutupModalEdit = function() {
            const modal = document.getElementById('editModal');
            const content = document.getElementById('editModalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Simpan Perubahan Edit Pelanggan ke Firestore
        window.simpanEditPelanggan = async function() {
            const id = document.getElementById('editUserId').value;
            const emailBaru = document.getElementById('editEmailInput').value.trim();

            if (!emailBaru) {
                alert("Email / nama tidak boleh kosong!");
                return;
            }

            try {
                const userRef = doc(db, "users", id);
                await updateDoc(userRef, { email: emailBaru });
                showToast("✨ Data akun berhasil diperbarui!");
                tutupModalEdit();
                muatDataPelanggan();
            } catch (err) {
                console.error("Gagal memperbarui data:", err);
                showToast("❌ Gagal memperbarui data akun!");
            }
        }

        // Buka Modal Konfirmasi Hapus dengan Animasi Smooth
        window.bukaModalHapus = function(id) {
            document.getElementById('deleteUserId').value = id;
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        // Tutup Modal Konfirmasi Hapus dengan Animasi Smooth
        window.tutupModalHapus = function() {
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Eksekusi Hapus Pelanggan dari Firestore
        window.eksekusiHapusPelanggan = async function() {
            const id = document.getElementById('deleteUserId').value;
            tutupModalHapus();

            try {
                const userRef = doc(db, "users", id);
                await deleteDoc(userRef);
                showToast("🗑️ Akun berhasil dihapus!");
                muatDataPelanggan();
            } catch (err) {
                console.error("Gagal menghapus akun:", err);
                showToast("❌ Gagal menghapus akun!");
            }
        }
    </script>
</body>
</html>
