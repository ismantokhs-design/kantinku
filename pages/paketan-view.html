<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Paketan Makanan - Kantin Ku</title>
    <!-- Tailwind CSS CDN Stabil -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Manifest PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#dc2626">
    <style>
        /* Menghilangkan scrollbar secara universal */
        ::-webkit-scrollbar {
            display: none;
        }
        body, html {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col justify-between pb-24">

    <!-- ================= HEADER ATAS ================= -->
    <header class="bg-white shadow-sm p-3.5 flex justify-between items-center sticky top-0 z-40">
        <a href="../index.html" class="flex items-center gap-2 text-gray-700 hover:text-red-600 transition font-semibold text-sm">
            <span>←</span> Beranda
        </a>
        <h1 class="text-sm font-bold text-gray-900">🎁 Paketan Makanan</h1>
        <div class="w-12"></div>
    </header>

    <!-- ================= KONTEN UTAMA ================= -->
    <main class="p-4 max-w-md mx-auto w-full space-y-4 flex-1">
        <!-- Informasi Header Kecil -->
        <div class="bg-red-50 border border-red-100 rounded-2xl p-3 text-[11px] text-red-700 leading-relaxed">
            ✨ Nikmati berbagai pilihan menu paket hemat dan spesial kami dengan harga terbaik setiap hari!
        </div>

        <!-- Kolom Pencarian -->
        <div class="relative">
            <input type="text" id="searchInput" placeholder="Cari paket makanan..." 
                class="w-full pl-4 pr-10 py-2.5 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
            <span class="absolute right-3 top-3 text-gray-400">🔍</span>
        </div>

        <!-- Grid Daftar Paketan -->
        <div id="paketanGridContainer" class="grid grid-cols-2 gap-3">
            <p class="col-span-2 text-center text-xs text-gray-400 py-8">Memuat daftar paketan...</p>
        </div>
    </main>

    <!-- ================= PENAMPUNG NAVIGASI BAWAH OTOMATIS ================= -->
    <div id="appNavigation"></div>

    <!-- ================= MODAL ZOOM GAMBAR (LIGHTROOM) ================= -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4 z-[99] hidden">
        <div class="relative max-w-2xl w-full flex flex-col items-center">
            <button id="closeImageModal" class="absolute -top-10 right-0 text-white hover:text-gray-300 font-bold text-2xl cursor-pointer bg-black/50 w-8 h-8 rounded-full flex items-center justify-center">✕</button>
            <img id="modalZoomImg" src="" alt="Zoom Image" class="max-h-[80vh] max-w-full rounded-2xl shadow-2xl object-contain border border-white/10">
            <p id="modalZoomCaption" class="text-white text-xs mt-3 font-medium text-center bg-black/60 px-4 py-1.5 rounded-full"></p>
        </div>
    </div>

    <!-- ================= SCRIPT LOGIKA & FIRESTORE ================= -->
    <script type="module">
        import { db } from "../assets/js/firebase-config.js";
        import { collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { initNavigation } from "../assets/js/navigation.js";

        // Inisialisasi Navigasi Terpusat (parameter 'paketan' menandakan menu Paketan yang aktif)
        document.addEventListener("DOMContentLoaded", () => {
            initNavigation('paketan');
            muatSemuaPaketan();
        });

        const paketanGridContainer = document.getElementById('paketanGridContainer');
        const searchInput = document.getElementById('searchInput');
        
        let allPaketan = [];
        let nomorTeleponToko = "6281234567890"; // Default fallback WhatsApp

        async function muatInfoToko() {
            try {
                const tokoRef = doc(db, "toko", "informasi");
                const tokoSnap = await getDoc(tokoRef);
                if (tokoSnap.exists() && tokoSnap.data().telepon) {
                    let telp = tokoSnap.data().telepon.trim();
                    if (telp.startsWith('0')) {
                        nomorTeleponToko = '62' + telp.slice(1);
                    } else if (telp.startsWith('+')) {
                        nomorTeleponToko = telp.replace('+', '');
                    } else {
                        nomorTeleponToko = telp;
                    }
                }
            } catch (err) {
                console.error("Gagal memuat info toko:", err);
            }
        }

        async function muatSemuaPaketan() {
            try {
                await muatInfoToko();
                const querySnapshot = await getDocs(collection(db, "paketan"));
                allPaketan = [];
                querySnapshot.forEach((docSnap) => {
                    allPaketan.push({ id: docSnap.id, ...docSnap.data() });
                });

                tampilkanPaketan(allPaketan);
            } catch (err) {
                console.error("Gagal memuat paketan:", err);
                paketanGridContainer.innerHTML = `<p class="col-span-2 text-center text-xs text-red-500 py-8">Gagal memuat data paketan.</p>`;
            }
        }

        function tampilkanPaketan(dataArray) {
            if (dataArray.length === 0) {
                paketanGridContainer.innerHTML = `<p class="col-span-2 text-center text-xs text-gray-400 py-8">Belum ada paketan makanan tersedia.</p>`;
                return;
            }

            paketanGridContainer.innerHTML = "";
            dataArray.forEach((data) => {
                const formattedHarga = data.harga ? `Rp ${Number(data.harga).toLocaleString('id-ID')}` : 'Rp 0';
                const gambarSrc = data.gambar || '../assets/img/placeholder.png';
                
                const pesanWA = encodeURIComponent(`Halo, saya ingin memesan *${data.nama}* (${formattedHarga}). Apakah masih tersedia?`);
                const linkWA = `https://wa.me/${nomorTeleponToko}?text=${pesanWA}`;

                const card = `
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col justify-between border border-gray-100">
                        <div class="h-32 bg-gray-200 overflow-hidden cursor-pointer relative" onclick="openImageZoom('${gambarSrc}', '${data.nama} - ${data.deskripsi || ''} - ${formattedHarga}')">
                            <img src="${gambarSrc}" alt="${data.nama}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                        </div>
                        <div class="p-2.5 space-y-1.5 flex-1 flex flex-col justify-between">
                            <div>
                                <p class="text-xs font-bold text-gray-900 truncate">${data.nama}</p>
                                <p class="text-[11px] text-gray-500 line-clamp-2">${data.deskripsi || '-'}</p>
                                <p class="text-xs font-black text-red-600 mt-1">${formattedHarga}</p>
                                <p class="text-[10px] text-gray-400 mt-0.5">📅 s/d ${data.masaBerlaku || '-'}</p>
                            </div>
                            <a href="${linkWA}" target="_blank" class="w-full bg-red-600 hover:bg-red-700 text-white py-1.5 rounded-lg text-center font-bold text-[11px] shadow-sm transition block mt-2">
                                🛒 Pesan
                            </a>
                        </div>
                    </div>
                `;
                paketanGridContainer.innerHTML += card;
            });
        }

        // Pencarian Real-time
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allPaketan.filter(item => 
                item.nama.toLowerCase().includes(keyword) || 
                (item.deskripsi && item.deskripsi.toLowerCase().includes(keyword)) ||
                (item.harga && item.harga.toString().toLowerCase().includes(keyword))
            );
            tampilkanPaketan(filtered);
        });

        // Modal Zoom Gambar (Lightroom)
        const imageModal = document.getElementById('imageModal');
        const modalZoomImg = document.getElementById('modalZoomImg');
        const modalZoomCaption = document.getElementById('modalZoomCaption');
        const closeImageModal = document.getElementById('closeImageModal');

        window.openImageZoom = function(imgSrc, captionText) {
            modalZoomImg.src = imgSrc;
            modalZoomCaption.textContent = captionText || '';
            imageModal.classList.remove('hidden');
        };

        const closeZoomFn = () => imageModal.classList.add('hidden');
        closeImageModal.addEventListener('click', closeZoomFn);
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) closeZoomFn();
        });
    </script>
</body>
</html>
