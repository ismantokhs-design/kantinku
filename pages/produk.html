<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantin Ku PWA - Produk</title>
    <!-- Tailwind CSS CDN Stabil -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Manifest PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#dc2626">
    
    <!-- CSS Tambahan untuk Hilangkan Scrollbar & Styling Tab -->
    <style>
        ::-webkit-scrollbar {
            display: none;
        }
        body, html {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col justify-between overflow-y-auto">

    <!-- ================= CEK OTENTIKASI LOKAL PERMANEN ================= -->
    <script>
        const isLoggedIn = localStorage.getItem('kantin_logged_in');
        if (!isLoggedIn) {
            window.location.replace('../login.html');
        } else {
            window.addEventListener('DOMContentLoaded', () => {
                const mainApp = document.getElementById('mainApp');
                if (mainApp) mainApp.classList.remove('hidden');
            });
        }
    </script>

    <!-- ================= TOAST NOTIFIKASI ================= -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span id="toastMsg">Berhasil</span>
    </div>

    <!-- ================= HALAMAN UTAMA PRODUK ================= -->
    <div id="mainApp" class="flex flex-col min-h-screen pb-24 hidden">
        <!-- Header Atas -->
        <header class="bg-white shadow-sm p-3.5 flex justify-between items-center sticky top-0 z-40">
            <h1 class="text-sm font-bold text-gray-900 flex items-center gap-2">
                <span>📦</span> Daftar Produk
            </h1>
            <!-- Tombol Tambah (+) Produk -->
            <button onclick="toggleAddModal()" class="w-8 h-8 rounded-full bg-red-600 hover:bg-red-700 text-white flex items-center justify-center font-bold text-base shadow transition cursor-pointer" title="Tambah Produk">
                +
            </button>
        </header>

        <!-- Konten Utama -->
        <main class="p-4 max-w-md mx-auto w-full space-y-4 flex-1">
            
            <!-- TAB KATEGORI -->
            <div class="grid grid-cols-5 gap-1.5 overflow-x-auto pb-1 no-scrollbar">
                <button onclick="switchTab('Makanan')" id="tab-Makanan" class="tab-btn px-2 py-2 rounded-xl text-[11px] font-bold transition whitespace-nowrap bg-red-600 text-white shadow-sm cursor-pointer text-center truncate">
                    🍱 Makanan
                </button>
                <button onclick="switchTab('Minuman')" id="tab-Minuman" class="tab-btn px-2 py-2 rounded-xl text-[11px] font-bold transition whitespace-nowrap bg-white text-gray-600 border border-gray-200 shadow-xs cursor-pointer text-center truncate">
                    🥤 Minuman
                </button>
                <button onclick="switchTab('Mie')" id="tab-Mie" class="tab-btn px-2 py-2 rounded-xl text-[11px] font-bold transition whitespace-nowrap bg-white text-gray-600 border border-gray-200 shadow-xs cursor-pointer text-center truncate">
                    🍜 Mie
                </button>
                <button onclick="switchTab('Camilan')" id="tab-Camilan" class="tab-btn px-2 py-2 rounded-xl text-[11px] font-bold transition whitespace-nowrap bg-white text-gray-600 border border-gray-200 shadow-xs cursor-pointer text-center truncate">
                    🍿 Camilan
                </button>
                <button onclick="switchTab('Lainnya')" id="tab-Lainnya" class="tab-btn px-2 py-2 rounded-xl text-[11px] font-bold transition whitespace-nowrap bg-white text-gray-600 border border-gray-200 shadow-xs cursor-pointer text-center truncate">
                    📂 Lainnya
                </button>
            </div>

            <!-- Grid Kontainer Produk -->
            <div id="produkGridContainer" class="grid grid-cols-2 gap-3">
                <p class="col-span-2 text-center text-xs text-gray-400 py-8">Memuat produk...</p>
            </div>

        </main>

        <!-- ================= PENAMPUNG NAVIGASI BAWAH OTOMATIS ================= -->
        <div id="appNavigation"></div>
    </div>

    <!-- ================= MODAL TAMBAH PRODUK ================= -->
    <div id="addProductModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-[90] p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-3xl p-5 space-y-4 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="font-bold text-sm text-gray-900">➕ Tambah Produk Baru</h3>
                <button onclick="toggleAddModal()" class="text-gray-400 hover:text-gray-600 font-bold text-sm cursor-pointer">✕</button>
            </div>

            <form id="formTambahProduk" onsubmit="simpanProdukBaru(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Produk</label>
                    <input type="text" id="inputNama" required placeholder="Contoh: Nasi Goreng Spesial" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Kategori</label>
                    <select id="inputKategori" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600 bg-white">
                        <option value="Makanan">Makanan</option>
                        <option value="Minuman">Minuman</option>
                        <option value="Mie">Mie</option>
                        <option value="Camilan">Camilan</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Harga (Rp)</label>
                        <input type="text" id="inputHarga" required placeholder="15.000" oninput="formatRupiahInput(this)" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Stok</label>
                        <input type="number" id="inputStok" required value="10" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Foto Produk</label>
                    <input type="file" id="inputGambarFile" accept="image/*" required onchange="previewImage(event)" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-xs file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 cursor-pointer">
                </div>
                <!-- Container Pratinjau Gambar -->
                <div id="previewContainer" class="hidden relative w-full h-32 bg-gray-100 rounded-xl overflow-hidden border border-gray-200 flex items-center justify-center">
                    <img id="imgPreview" src="" alt="Pratinjau Foto" class="w-full h-full object-cover">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Keterangan / Deskripsi</label>
                    <textarea id="inputKeterangan" rows="2" placeholder="Deskripsi singkat produk..." class="w-full px-3 py-2 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" id="btnSimpanProduk" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold shadow transition cursor-pointer text-xs flex items-center justify-center gap-2">
                        <span>💾</span> Simpan Produk ke Database
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Lightroom / Zoom Gambar -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4 z-[99] hidden">
        <div class="relative max-w-2xl w-full flex flex-col items-center">
            <button id="closeImageModal" class="absolute -top-10 right-0 text-white hover:text-gray-300 font-bold text-2xl cursor-pointer bg-black/50 w-8 h-8 rounded-full flex items-center justify-center">✕</button>
            <img id="modalZoomImg" src="" alt="Zoom Image" class="max-h-[80vh] max-w-full rounded-2xl shadow-2xl object-contain border border-white/10">
            <p id="modalZoomCaption" class="text-white text-xs mt-3 font-medium text-center bg-black/60 px-4 py-1.5 rounded-full"></p>
        </div>
    </div>

    <!-- Skrip Logika Tab, Form Input & Firestore -->
    <script type="module">
        import { db } from "../assets/js/firebase-config.js";
        import { collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { initNavigation } from "../assets/js/navigation.js";

        // Inisialisasi Navigasi Terpusat (parameter 'produk' menandakan menu Produk aktif)
        document.addEventListener("DOMContentLoaded", () => {
            initNavigation('produk');
            fetchProducts();
        });

        let currentCategory = "Makanan";
        let allProductsCache = [];

        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        // Fungsi Format Ribuan Otomatis pada Input Harga
        window.formatRupiahInput = function(input) {
            let angka = input.value.replace(/[^,\d]/g, '').toString();
            let split = angka.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }

            rupiah = split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
            input.value = rupiah;
        };

        // Fungsi Preview Gambar Saat Dipilih
        window.previewImage = function(event) {
            const file = event.target.files[0];
            const previewContainer = document.getElementById('previewContainer');
            const imgPreview = document.getElementById('imgPreview');

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgPreview.src = e.target.result;
                    previewContainer.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            } else {
                imgPreview.src = '';
                previewContainer.classList.add('hidden');
            }
        };

        // Toggle Modal Tambah Produk
        window.toggleAddModal = function() {
            const modal = document.getElementById('addProductModal');
            modal.classList.toggle('hidden');
            if (modal.classList.contains('hidden')) {
                document.getElementById('formTambahProduk').reset();
                document.getElementById('previewContainer').classList.add('hidden');
            }
        };

        // Zoom Gambar Modal (Lightroom)
        const imageModal = document.getElementById('imageModal');
        const modalZoomImg = document.getElementById('modalZoomImg');
        const modalZoomCaption = document.getElementById('modalZoomCaption');
        const closeImageModal = document.getElementById('closeImageModal');

        window.openImageZoom = function(imgSrc, captionText) {
            modalZoomImg.src = imgSrc;
            modalZoomCaption.textContent = captionText || '';
            imageModal.classList.remove('hidden');
        };

        const closeZoomFn = () => imageModal.classList.add('hidden');
        closeImageModal.addEventListener('click', closeZoomFn);
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) closeZoomFn();
        });

        // Fungsi Ganti Tab
        window.switchTab = function(category) {
            currentCategory = category;
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-red-600', 'text-white', 'shadow-sm');
                btn.classList.add('bg-white', 'text-gray-600', 'border', 'border-gray-200', 'shadow-xs');
            });

            const activeBtn = document.getElementById(`tab-${category}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-white', 'text-gray-600', 'border', 'border-gray-200', 'shadow-xs');
                activeBtn.classList.add('bg-red-600', 'text-white', 'shadow-sm');
            }

            renderProducts();
        };

        // Ambil Data Produk dari Firestore
        async function fetchProducts() {
            const container = document.getElementById('produkGridContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "produk"));
                allProductsCache = [];

                querySnapshot.forEach((docSnap) => {
                    allProductsCache.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderProducts();
            } catch (err) {
                console.error("Gagal memuat produk: ", err);
                container.innerHTML = `<p class="col-span-2 text-center text-xs text-red-500 py-4">Gagal memuat data produk.</p>`;
            }
        }

        // Render Produk Berdasarkan Tab yang Dipilih
        function renderProducts() {
            const container = document.getElementById('produkGridContainer');
            
            const filtered = allProductsCache.filter(item => {
                const itemCat = item.kategori || "Makanan"; 
                return itemCat.toLowerCase() === currentCategory.toLowerCase();
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p class="col-span-2 text-center text-xs text-gray-400 py-8">Belum ada produk di kategori ${currentCategory}.</p>`;
                return;
            }

            let html = "";
            filtered.forEach(data => {
                const formattedHarga = data.harga ? `Rp ${data.harga}` : 'Rp 0';
                html += `
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col justify-between border border-gray-100">
                        <div class="h-32 bg-gray-200 overflow-hidden cursor-pointer relative" onclick="openImageZoom('${data.gambar}', '${data.nama} - ${data.keterangan || ''} - ${formattedHarga}')">
                            <img src="${data.gambar}" alt="${data.nama}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                        </div>
                        <div class="p-2.5 space-y-1">
                            <p class="text-xs font-bold text-gray-900 truncate">${data.nama}</p>
                            <p class="text-[11px] text-gray-500 truncate">${data.keterangan || ''}</p>
                            <p class="text-xs font-black text-red-600">${formattedHarga}</p>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Simpan Produk Baru ke Firestore (Konversi Gambar ke Base64)
        window.simpanProdukBaru = async function(e) {
            e.preventDefault();
            const btnSimpan = document.getElementById('btnSimpanProduk');
            btnSimpan.textContent = "Menyimpan...";
            btnSimpan.disabled = true;

            const fileInput = document.getElementById('inputGambarFile');
            const file = fileInput.files[0];

            if (!file) {
                alert("Silakan pilih gambar produk terlebih dahulu!");
                btnSimpan.textContent = "💾 Simpan Produk ke Database";
                btnSimpan.disabled = false;
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(uploadEvent) {
                try {
                    const base64Gambar = uploadEvent.target.result;
                    const nama = document.getElementById('inputNama').value.trim();
                    const kategori = document.getElementById('inputKategori').value;
                    const harga = document.getElementById('inputHarga').value.trim();
                    const stok = parseInt(document.getElementById('inputStok').value) || 0;
                    const keterangan = document.getElementById('inputKeterangan').value.trim();

                    const produkBaru = {
                        nama,
                        kategori,
                        harga,
                        stok,
                        gambar: base64Gambar,
                        keterangan,
                        createdAt: new Date().toISOString()
                    };

                    await addDoc(collection(db, "produk"), produkBaru);

                    showToast("✨ Produk berhasil ditambahkan!");
                    toggleAddModal();
                    document.getElementById('formTambahProduk').reset();
                    document.getElementById('previewContainer').classList.add('hidden');
                    fetchProducts(); // Refresh daftar produk
                } catch (err) {
                    console.error("Gagal menyimpan produk: ", err);
                    showToast("❌ Gagal menyimpan produk!");
                } finally {
                    btnSimpan.textContent = "💾 Simpan Produk ke Database";
                    btnSimpan.disabled = false;
                }
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
</html>
