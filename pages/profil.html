<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Toko - Warungku PWA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Manifest PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#dc2626">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col justify-between pb-24 relative">

    <!-- ================= TOAST NOTIFICATION (SMOOTH POPUP) ================= -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <span id="toastMsg">Pesan berhasil</span>
    </div>

    <!-- ================= HEADER ATAS ================= -->
    <header class="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-40">
        <a href="manajemen.html" class="flex items-center gap-2 text-gray-700 hover:text-red-600 transition font-semibold text-sm">
            <span>←</span> Kembali
        </a>
        <div class="inline-flex items-center border-2 border-red-600 rounded-full px-3 py-1">
            <div class="w-5 h-5 bg-blue-900 rounded-full flex items-center justify-center text-white font-bold text-xs mr-1">W</div>
            <div class="text-left leading-tight">
                <span class="block text-[9px] font-semibold text-black tracking-wider uppercase">APLIKASI</span>
                <span class="block text-sm font-black text-red-600 leading-none">warungku</span>
            </div>
        </div>
    </header>

    <!-- ================= KONTEN UTAMA PROFIL TOKO ================= -->
    <main class="p-4 max-w-md mx-auto w-full space-y-4 flex-1">
        <!-- Judul Halaman -->
        <div>
            <h1 class="text-lg font-bold text-gray-900">Profil Toko / Warung</h1>
            <p class="text-xs text-gray-500 mt-0.5">Kelola identitas, nama pemilik, alamat, dan kontak warung Anda.</p>
        </div>

        <!-- Form Profil Toko -->
        <form id="tokoForm" class="bg-white p-5 rounded-2xl shadow-xs border border-gray-100 space-y-4">
            <!-- Logo / Foto Warung -->
            <div class="flex flex-col items-center space-y-3 pb-2 border-b border-gray-100">
                <div class="w-20 h-20 rounded-full bg-blue-900 text-white flex items-center justify-center font-bold text-2xl overflow-hidden shadow-md">
                    <span id="logoInitial">W</span>
                    <img id="logoImg" src="" alt="Logo Warung" class="w-full h-full object-cover hidden">
                </div>
                <div>
                    <label class="cursor-pointer bg-red-50 hover:bg-red-100 text-red-700 text-xs font-bold px-3 py-1.5 rounded-xl transition inline-block">
                        Ubah Logo / Foto
                        <input type="file" id="logoFile" accept="image/*" class="hidden">
                    </label>
                </div>
            </div>

            <!-- Nama Warung -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Warung</label>
                <input type="text" id="namaWarung" required placeholder="Misal: Warung Berkah Selalu" 
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>

            <!-- Nama Pemilik -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Pemilik / Pengelola</label>
                <input type="text" id="namaPemilik" required placeholder="Misal: Bp. Ismanto" 
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>

            <!-- Nomor Telepon / WhatsApp -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Nomor Telepon / WhatsApp</label>
                <input type="tel" id="teleponWarung" required placeholder="Misal: 081234567890" 
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>

            <!-- Alamat Lengkap -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Alamat Lengkap Warung</label>
                <textarea id="alamatWarung" rows="3" required placeholder="Misal: Jl. Raya Potrobayan No. 12, Bantul, Yogyakarta" 
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-600"></textarea>
            </div>

            <button type="submit" id="btnSimpanToko" class="w-full bg-blue-900 hover:bg-blue-950 text-white py-3 rounded-xl font-bold shadow transition cursor-pointer text-xs">
                Simpan Profil Warung
            </button>
        </form>
    </main>

    <!-- ================= NAVIGASI BAWAH ================= -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-4 flex justify-around items-center z-50 max-w-md mx-auto">
        <a href="../index.html" class="flex flex-col items-center text-gray-400 text-xs font-medium">
            <span class="text-lg">🏠</span>
            <span>Beranda</span>
        </a>
        <a href="promo.html" class="flex flex-col items-center text-gray-400 text-xs font-medium">
            <span class="text-lg">🏷️</span>
            <span>Promo</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 text-xs font-medium">
            <span class="text-lg">📢</span>
            <span>Broadcast</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 text-xs font-medium">
            <span class="text-lg">📅</span>
            <span>Event</span>
        </a>
        <button id="btnLainnya" class="flex flex-col items-center text-red-600 text-xs font-semibold bg-transparent border-none cursor-pointer focus:outline-none">
            <span class="text-lg">☰</span>
            <span>Lainnya</span>
        </button>
    </nav>

    <!-- ================= OPTION MENU (POP-UP) ================= -->
    <div id="optionMenuModal" class="fixed inset-0 bg-black/30 flex items-end justify-end pb-16 pr-4 z-50 hidden">
        <div class="bg-white text-gray-800 w-52 rounded-2xl shadow-xl overflow-hidden border border-gray-200">
            <div class="bg-red-600 text-white px-4 py-2.5 flex justify-between items-center">
                <span class="font-bold tracking-wider text-xs uppercase">OPTION MENU</span>
                <button id="btnCloseOption" class="text-white hover:text-gray-200 font-bold text-sm cursor-pointer">✕</button>
            </div>
            <div class="py-1 divide-y divide-gray-100 text-xs font-medium">
                <a href="profil.html" class="flex items-center gap-3 px-4 py-3 bg-red-50 text-red-600 font-bold transition">
                    <span class="text-base">⚙️</span>
                    <span>Pengaturan</span>
                </a>
                <a href="manajemen.html" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition text-gray-700">
                    <span class="text-red-600 text-base">🏷️</span>
                    <span>Manajemen</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition text-gray-700">
                    <span class="text-red-600 text-base">📅</span>
                    <span>Event</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition text-gray-700">
                    <span class="text-red-600 text-base">📦</span>
                    <span>Lihat Pesanan</span>
                </a>
            </div>
        </div>
    </div>

    <!-- ================= SCRIPT LOGIKA & FIRESTORE ================= -->
    <script type="module">
        import { db } from "../assets/js/firebase-config.js";
        import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const tokoForm = document.getElementById('tokoForm');
        const namaWarung = document.getElementById('namaWarung');
        const namaPemilik = document.getElementById('namaPemilik');
        const teleponWarung = document.getElementById('teleponWarung');
        const alamatWarung = document.getElementById('alamatWarung');
        const logoFile = document.getElementById('logoFile');
        const logoInitial = document.getElementById('logoInitial');
        const logoImg = document.getElementById('logoImg');
        const btnSimpanToko = document.getElementById('btnSimpanToko');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        let base64Logo = "";

        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Ambil Data Profil Toko dari Firestore (Koleksi "toko", Dokumen "informasi")
        async function muatProfilToko() {
            try {
                const tokoRef = doc(db, "toko", "informasi");
                const tokoSnap = await getDoc(tokoRef);

                if (tokoSnap.exists()) {
                    const data = tokoSnap.data();
                    namaWarung.value = data.namaWarung || "";
                    namaPemilik.value = data.namaPemilik || "";
                    teleponWarung.value = data.telepon || "";
                    alamatWarung.value = data.alamat || "";

                    if (data.logo) {
                        base64Logo = data.logo;
                        logoImg.src = data.logo;
                        logoImg.classList.remove('hidden');
                        logoInitial.classList.add('hidden');
                    }
                }
            } catch (err) {
                console.error("Gagal memuat profil toko: ", err);
            }
        }

        // Konversi Logo ke Base64
        logoFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    base64Logo = uploadEvent.target.result;
                    logoImg.src = base64Logo;
                    logoImg.classList.remove('hidden');
                    logoInitial.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Simpan Profil Toko ke Firestore
        tokoForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            btnSimpanToko.textContent = "Menyimpan...";
            btnSimpanToko.disabled = true;

            try {
                const tokoRef = doc(db, "toko", "informasi");
                const tokoSnap = await getDoc(tokoRef);

                const dataToko = {
                    namaWarung: namaWarung.value.trim(),
                    namaPemilik: namaPemilik.value.trim(),
                    telepon: teleponWarung.value.trim(),
                    alamat: alamatWarung.value.trim(),
                    logo: base64Logo,
                    updatedAt: new Date().toISOString()
                };

                if (tokoSnap.exists()) {
                    await updateDoc(tokoRef, dataToko);
                } else {
                    await setDoc(tokoRef, dataToko);
                }

                showToast("✨ Profil warung berhasil disimpan!");
            } catch (error) {
                console.error("Gagal menyimpan profil warung: ", error);
                showToast("❌ Gagal menyimpan perubahan!");
            } finally {
                btnSimpanToko.textContent = "Simpan Profil Warung";
                btnSimpanToko.disabled = false;
            }
        });

        document.addEventListener("DOMContentLoaded", muatProfilToko);

        // Skrip Option Menu Bawah
        const btnLainnya = document.getElementById('btnLainnya');
        const optionMenuModal = document.getElementById('optionMenuModal');
        const btnCloseOption = document.getElementById('btnCloseOption');

        btnLainnya.addEventListener('click', (e) => {
            e.stopPropagation();
            optionMenuModal.classList.remove('hidden');
        });

        btnCloseOption.addEventListener('click', () => {
            optionMenuModal.classList.add('hidden');
        });

        window.addEventListener('click', (e) => {
            if (e.target === optionMenuModal) {
                optionMenuModal.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
