<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantin Ku PWA - Dashboard</title>
    <!-- Tailwind CSS CDN Stabil -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
    
    <!-- CSS Tambahan untuk Running Text & Scrollbar -->
    <style>
        ::-webkit-scrollbar {
            display: none;
        }
        body, html {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 18s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col justify-between overflow-y-auto">

    <!-- ================= CEK OTENTIKASI LOKAL PERMANEN ================= -->
    <script>
        const isLoggedIn = localStorage.getItem('kantin_logged_in');
        if (!isLoggedIn) {
            window.location.replace('login.html');
        } else {
            window.addEventListener('DOMContentLoaded', () => {
                const mainApp = document.getElementById('mainApp');
                if (mainApp) mainApp.classList.remove('hidden');
                
                const userEmail = localStorage.getItem('kantin_user_email') || "User";
                const emailDisplay = document.getElementById('userEmailDisplay');
                const avatar = document.getElementById('userAvatar');
                
                if (emailDisplay) emailDisplay.textContent = userEmail;
                if (avatar) avatar.textContent = userEmail.charAt(0).toUpperCase();
            });
        }
    </script>

    <!-- ================= HALAMAN UTAMA (DASHBOARD) - DISEMBUNYIKAN DI AWAL ================= -->
    <div id="mainApp" class="flex flex-col min-h-screen pb-24 hidden">
        <!-- Header Atas -->
        <header class="bg-white shadow-xs p-3 flex justify-between items-center sticky top-0 z-40">
            <!-- Profil Toko di Kiri -->
            <div class="relative">
                <button id="profileTokoBtn" class="flex items-center gap-2.5 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-full py-1.5 pl-1.5 pr-3.5 transition shadow-xs focus:outline-none cursor-pointer">
                    <div class="w-9 h-9 rounded-full bg-blue-900 text-white flex items-center justify-center font-bold text-sm overflow-hidden shadow-inner shrink-0">
                        <span id="headerLogoInitial">K</span>
                        <img id="headerLogoImg" src="" alt="Logo" class="w-full h-full object-cover hidden">
                    </div>
                    <div class="text-left leading-tight">
                        <span id="headerNamaWarung" class="block text-xs font-bold text-gray-900 truncate max-w-[140px]">Kantin Ku</span>
                        <span id="headerTeleponWarung" class="block text-[10px] text-gray-500 truncate max-w-[140px]">01234567896</span>
                        <span id="headerAlamatWarung" class="block text-[9px] text-gray-400 truncate max-w-[140px]">Alamat...</span>
                    </div>
                </button>

                <!-- Dropdown Detail Toko -->
                <div id="dropdownToko" class="absolute left-0 mt-2 w-64 bg-white border border-gray-200 rounded-2xl shadow-xl py-3 px-4 hidden z-50 space-y-3">
                    <div class="border-b border-gray-100 pb-2.5">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Informasi Toko</p>
                        <p id="dropNamaWarung" class="text-xs font-bold text-gray-900 mt-0.5">Kantin Ku</p>
                        <p id="dropAlamatWarung" class="text-[11px] text-gray-500 mt-0.5 leading-snug">Alamat belum diatur.</p>
                    </div>
                    <div class="space-y-1.5">
                        <a href="pages/profil.html" class="w-full text-left px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-50 rounded-xl transition flex items-center gap-2">
                            <span>⚙️</span> Edit Profil Toko
                        </a>
                    </div>
                </div>
            </div>

            <!-- User Login di Kanan -->
            <div class="relative">
                <button id="profileBtn" class="flex items-center space-x-2 focus:outline-none cursor-pointer">
                    <div id="userAvatar" class="w-10 h-10 rounded-full bg-blue-900 text-white overflow-hidden flex items-center justify-center font-bold text-sm shadow">
                        U
                    </div>
                </button>

                <!-- Menu Dropdown User -->
                <div id="dropdownMenu" class="absolute right-0 mt-2 w-56 bg-white border border-gray-200 rounded-xl shadow-lg py-2 hidden z-50 divide-y divide-gray-100">
                    <div class="px-4 py-2">
                        <p class="text-xs text-gray-400">Masuk sebagai:</p>
                        <p id="userEmailDisplay" class="text-xs font-bold text-gray-800 truncate">User</p>
                    </div>
                    <div class="py-1">
                        <a href="pages/profil-pelanggan.html" class="w-full text-left px-4 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-50 transition flex items-center gap-2">
                            <span>👤</span> Lengkapi Profil
                        </a>
                    </div>
                    <div class="py-1">
                        <button id="btnLogout" class="w-full text-left px-4 py-2 text-xs font-semibold text-red-600 hover:bg-red-50 transition flex items-center gap-2 cursor-pointer">
                            <span>🚪</span> Keluar
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Konten Beranda -->
        <main class="p-4 max-w-md mx-auto w-full space-y-4 flex-1">
            <!-- Banner Slider Dinamis -->
            <div class="bg-white rounded-2xl shadow-xs overflow-hidden p-2 space-y-2 border border-gray-100">
                <div class="h-44 bg-gray-200 rounded-xl overflow-hidden relative flex items-center justify-center">
                    <div id="sliderContainer" class="w-full h-full relative">
                        <div class="slide absolute inset-0 transition-opacity duration-700 opacity-100 flex items-center justify-center bg-gray-100 text-gray-400 text-xs">
                            Memuat banner...
                        </div>
                    </div>
                </div>
                <div id="sliderDots" class="flex justify-center space-x-1.5 py-1"></div>
            </div>

            <!-- Running Text Dinamis dari Database -->
            <div class="bg-white border border-gray-200 rounded-xl shadow-xs py-2 px-3 overflow-hidden flex items-center">
                <span class="text-red-600 font-bold text-xs mr-2 shrink-0 z-10 bg-white pr-1">📢 INFO:</span>
                <div class="w-full overflow-hidden relative">
                    <div id="runningTextContainer" class="animate-marquee text-xs font-medium text-gray-700">
                        Memuat informasi...
                    </div>
                </div>
            </div>

            <!-- Bagian Promo Hari Ini (Diambil dari koleksi produk dengan isPromo == true) -->
            <div class="space-y-3">
                <div class="flex justify-between items-center px-1">
                    <h2 class="font-bold text-base text-gray-900">Promo Hari Ini</h2>
                    <a href="pages/promo-view.html" class="text-xs font-semibold text-blue-600 cursor-pointer hover:underline">Lihat Semua</a>
                </div>
                <div id="promoGridContainer" class="grid grid-cols-2 gap-3">
                    <p class="col-span-2 text-center text-xs text-gray-400 py-4">Memuat promo...</p>
                </div>
            </div>
        </main>

        <!-- PENAMPUNG NAVIGASI BAWAH OTOMATIS -->
        <div id="appNavigation"></div>
    </div>

    <!-- Modal Lightroom / Zoom Gambar -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4 z-[99] hidden">
        <div class="relative max-w-2xl w-full flex flex-col items-center">
            <button id="closeImageModal" class="absolute -top-10 right-0 text-white hover:text-gray-300 font-bold text-2xl cursor-pointer bg-black/50 w-8 h-8 rounded-full flex items-center justify-center">✕</button>
            <img id="modalZoomImg" src="" alt="Zoom Image" class="max-h-[80vh] max-w-full rounded-2xl shadow-2xl object-contain border border-white/10">
            <p id="modalZoomCaption" class="text-white text-xs mt-3 font-medium text-center bg-black/60 px-4 py-1.5 rounded-full"></p>
        </div>
    </div>

    <!-- Skrip Logika Dashboard & Firestore -->
    <script type="module">
        import { db } from "./assets/js/firebase-config.js";
        import { collection, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { initNavigation } from "./assets/js/navigation.js";

        // Panggil Navigasi Terpusat (parameter 'home' menandakan halaman Beranda yang aktif)
        document.addEventListener("DOMContentLoaded", () => {
            initNavigation('home');
            loadDynamicContent();
        });

        // Tombol Keluar / Logout
        const btnLogout = document.getElementById('btnLogout');
        if (btnLogout) {
            btnLogout.addEventListener('click', () => {
                localStorage.removeItem('kantin_logged_in');
                localStorage.removeItem('kantin_user_email');
                localStorage.removeItem('kantin_user_role');
                window.location.replace('login.html');
            });
        }

        // Toggle Dropdown User
        const profileBtn = document.getElementById('profileBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        if (profileBtn) {
            profileBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownMenu.classList.toggle('hidden');
                if (dropdownToko) dropdownToko.classList.add('hidden');
            });
        }

        // Toggle Dropdown Info Toko
        const profileTokoBtn = document.getElementById('profileTokoBtn');
        const dropdownToko = document.getElementById('dropdownToko');
        if (profileTokoBtn) {
            profileTokoBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownToko.classList.toggle('hidden');
                if (dropdownMenu) dropdownMenu.classList.add('hidden');
            });
        }

        // Modal Zoom Gambar (Lightroom)
        const imageModal = document.getElementById('imageModal');
        const modalZoomImg = document.getElementById('modalZoomImg');
        const modalZoomCaption = document.getElementById('modalZoomCaption');
        const closeImageModal = document.getElementById('closeImageModal');

        window.openImageZoom = function(imgSrc, captionText) {
            modalZoomImg.src = imgSrc;
            modalZoomCaption.textContent = captionText || '';
            imageModal.classList.remove('hidden');
        };

        const closeZoomFn = () => imageModal.classList.add('hidden');
        closeImageModal.addEventListener('click', closeZoomFn);
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) closeZoomFn();
        });

        window.addEventListener('click', (e) => {
            if (dropdownMenu && !dropdownMenu.classList.contains('hidden') && !profileBtn.contains(e.target)) {
                dropdownMenu.classList.add('hidden');
            }
            if (dropdownToko && !dropdownToko.classList.contains('hidden') && !profileTokoBtn.contains(e.target)) {
                dropdownToko.classList.add('hidden');
            }
        });

        // Fungsi Memuat Konten Dinamis dari Firestore
        async function loadDynamicContent() {
            const sliderContainer = document.getElementById('sliderContainer');
            const sliderDots = document.getElementById('sliderDots');
            const runningTextContainer = document.getElementById('runningTextContainer');
            const promoGridContainer = document.getElementById('promoGridContainer');

            const headerNamaWarung = document.getElementById('headerNamaWarung');
            const headerTeleponWarung = document.getElementById('headerTeleponWarung');
            const headerAlamatWarung = document.getElementById('headerAlamatWarung');
            const headerLogoInitial = document.getElementById('headerLogoInitial');
            const headerLogoImg = document.getElementById('headerLogoImg');
            const dropNamaWarung = document.getElementById('dropNamaWarung');
            const dropAlamatWarung = document.getElementById('dropAlamatWarung');

            try {
                // 1. Ambil Profil Toko
                const tokoRef = doc(db, "toko", "informasi");
                const tokoSnap = await getDoc(tokoRef);

                if (tokoSnap.exists()) {
                    const tokoData = tokoSnap.data();
                    const namaW = tokoData.namaWarung || "Kantin Ku";
                    const telpW = tokoData.telepon || "01234567896";
                    const alamatW = tokoData.alamat || "Alamat belum diatur.";

                    if (headerNamaWarung) headerNamaWarung.textContent = namaW;
                    if (headerTeleponWarung) headerTeleponWarung.textContent = telpW;
                    if (headerAlamatWarung) headerAlamatWarung.textContent = alamatW;
                    if (dropNamaWarung) dropNamaWarung.textContent = namaW;
                    if (dropAlamatWarung) dropAlamatWarung.textContent = alamatW;

                    if (tokoData.logo && headerLogoImg && headerLogoInitial) {
                        headerLogoImg.src = tokoData.logo;
                        headerLogoImg.classList.remove('hidden');
                        headerLogoInitial.classList.add('hidden');
                    } else if (headerLogoInitial) {
                        headerLogoInitial.textContent = namaW.charAt(0).toUpperCase();
                    }
                }

                // 2. Ambil Banner Aktif
                const bannerQuery = query(collection(db, "banner"), where("status", "==", true));
                const bannerSnapshot = await getDocs(bannerQuery);

                if (!bannerSnapshot.empty && sliderContainer) {
                    let slidesHTML = "";
                    let dotsHTML = "";
                    let index = 0;

                    bannerSnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        const opacityClass = index === 0 ? "opacity-100" : "opacity-0";
                        const dotClass = index === 0 ? "bg-red-600 w-5" : "bg-gray-300 w-2";

                        slidesHTML += `
                            <div class="slide absolute inset-0 transition-opacity duration-700 ${opacityClass}">
                                <img src="${data.gambar}" alt="${data.nama}" class="w-full h-full object-cover cursor-pointer" onclick="openImageZoom('${data.gambar}', '${data.nama}')">
                                <div class="absolute bottom-3 left-3 bg-black/60 text-white text-xs px-3 py-1 rounded-full backdrop-blur-xs pointer-events-none">
                                    ${data.nama}
                                </div>
                            </div>
                        `;
                        dotsHTML += `<span class="dot h-2 rounded-full ${dotClass} transition-all duration-300 cursor-pointer" data-index="${index}"></span>`;
                        index++;
                    });

                    sliderContainer.innerHTML = slidesHTML;
                    if (sliderDots) sliderDots.innerHTML = dotsHTML;
                    startSliderTimer();
                } else if (sliderContainer) {
                    sliderContainer.innerHTML = `<div class="slide absolute inset-0 flex items-center justify-center bg-gray-100 text-gray-400 text-xs">Belum ada banner aktif</div>`;
                }

                // 3. Ambil Running Teks Aktif dari Database Firestore
                const teksQuery = query(collection(db, "running_teks"), where("status", "==", true));
                const teksSnapshot = await getDocs(teksQuery);

                if (!teksSnapshot.empty && runningTextContainer) {
                    let teksArray = [];
                    teksSnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        if (data.teks) {
                            teksArray.push(data.teks);
                        }
                    });

                    if (teksArray.length > 0) {
                        runningTextContainer.textContent = teksArray.join(" &nbsp;&nbsp;&bull;&nbsp;&nbsp; ");
                    } else {
                        runningTextContainer.textContent = "Selamat datang di Kantin Ku. Nikmati hidangan terbaik kami! ✨";
                    }
                } else if (runningTextContainer) {
                    runningTextContainer.textContent = "Selamat datang di Kantin Ku. Nikmati hidangan terbaik kami! ✨";
                }

                // 4. Ambil Produk Promo Aktif
                const promoQuery = query(collection(db, "produk"), where("isPromo", "==", true));
                const promoSnapshot = await getDocs(promoQuery);

                if (!promoSnapshot.empty && promoGridContainer) {
                    let promoHTML = "";
                    promoSnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        const formattedHarga = data.harga ? `Rp ${data.harga}` : 'Rp 0';
                        const gambarSrc = data.gambar || 'assets/img/placeholder.png';

                        promoHTML += `
                            <div class="bg-white rounded-xl shadow-xs overflow-hidden flex flex-col justify-between border border-gray-100">
                                <div class="h-32 bg-gray-200 overflow-hidden cursor-pointer relative" onclick="openImageZoom('${gambarSrc}', '${data.nama} - ${data.keterangan || ''} - ${formattedHarga}')">
                                    <img src="${gambarSrc}" alt="${data.nama}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                                </div>
                                <div class="p-2.5 space-y-1">
                                    <p class="text-xs font-bold text-gray-900 truncate">${data.nama}</p>
                                    <p class="text-[11px] text-gray-500 truncate">${data.keterangan || ''}</p>
                                    <p class="text-xs font-black text-red-600">${formattedHarga}</p>
                                </div>
                            </div>
                        `;
                    });
                    promoGridContainer.innerHTML = promoHTML;
                } else if (promoGridContainer) {
                    promoGridContainer.innerHTML = `<p class="col-span-2 text-center text-xs text-gray-400 py-4">Belum ada promo aktif.</p>`;
                }

            } catch (err) {
                console.error("Gagal memuat konten dinamis: ", err);
            }
        }

        function startSliderTimer() {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');
            if (slides.length <= 1) return;

            let currentIndex = 0;
            setInterval(() => {
                slides[currentIndex].classList.remove('opacity-100');
                slides[currentIndex].classList.add('opacity-0');
                if(dots[currentIndex]) {
                    dots[currentIndex].classList.remove('bg-red-600', 'w-5');
                    dots[currentIndex].classList.add('w-2', 'bg-gray-300');
                }

                currentIndex = (currentIndex + 1) % slides.length;

                slides[currentIndex].classList.remove('opacity-0');
                slides[currentIndex].classList.add('opacity-100');
                if(dots[currentIndex]) {
                    dots[currentIndex].classList.remove('w-2', 'bg-gray-300');
                    dots[currentIndex].classList.add('bg-red-600', 'w-5');
                }
            }, 3500);
        }
    </script>
</body>
</html>
